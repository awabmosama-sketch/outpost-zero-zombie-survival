        if (x >= 1440 && x <= 1565) { this.input.resetTouchSticks(); this.toggleShop(); return true; }
      }
      // Upgrade bar
      if (this.player.tierIndex < 3) {
        const ubY = this.roundManager && this.roundManager.isIntermission ? 116 : 66;
        if (x >= CONFIG.VIRTUAL_WIDTH / 2 - 170 && x <= CONFIG.VIRTUAL_WIDTH / 2 + 170 && y >= ubY && y <= ubY + 38) {
          this.tryUpgradeWeapon();
          return true;
        }
      }
      // Weapon slots
      const invSlotW = 180;
      const invTotalW = 4 * invSlotW + 3 * 14;
      const invStartX = (CONFIG.VIRTUAL_WIDTH - invTotalW) / 2;
      const invY = CONFIG.VIRTUAL_HEIGHT - 82;
      if (y >= invY - 6 && y <= invY + 74) {
        for (let i = 0; i < this.player.inventory.length; i++) {
          const sx = invStartX + i * (invSlotW + 14);
          if (x >= sx && x <= sx + invSlotW) {
            this.player.switchWeapon(this.player.inventory[i]);
            return true;
          }
        }
      }
      return false;
    }

    drawTouchControls(ctx) {
      const input = this.input;
      ctx.save();

      // Pause button (top bar)
      ctx.fillStyle = 'rgba(15, 23, 42, 0.9)';
      ctx.beginPath();
      ctx.roundRect(580, 12, 56, 36, 6);
      ctx.fill();
      ctx.strokeStyle = '#94a3b8';
      ctx.lineWidth = 1.5;
      ctx.stroke();
      ctx.fillStyle = '#e2e8f0';
      ctx.fillRect(598, 21, 6, 18);
      ctx.fillRect(612, 21, 6, 18);

      // Thumbsticks
      const drawStick = (stick, color, label) => {
        if (stick.id === null) return;
        ctx.fillStyle = 'rgba(15, 23, 42, 0.35)';
        ctx.strokeStyle = color;
        ctx.globalAlpha = 0.6;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(stick.ox, stick.oy, 110, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        ctx.globalAlpha = 0.85;
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.arc(stick.x, stick.y, 46, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
        ctx.fillStyle = '#0f172a';
        ctx.font = 'bold 15px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(label, stick.x, stick.y + 5);
      };
      drawStick(input.moveStick, '#38bdf8', 'MOVE');
      drawStick(input.aimStick, '#ef4444', 'FIRE');

      // First-time hints while sticks are idle
      if (input.moveStick.id === null && input.aimStick.id === null && this.roundManager && this.roundManager.round <= 1) {
        ctx.globalAlpha = 0.55;
        ctx.fillStyle = '#e2e8f0';
        ctx.font = 'bold 18px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('◀ DRAG HERE TO MOVE', 400, 470);
        ctx.fillText('DRAG HERE TO AIM & SHOOT ▶', 1100, 470);
        ctx.globalAlpha = 1;
      }

      // Action buttons
      const btns = this.getTouchButtons();
      for (const b of btns) {
        ctx.globalAlpha = 0.8;
        ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = b.color;
        ctx.lineWidth = 3;
        ctx.stroke();
        ctx.globalAlpha = 1;
        ctx.fillStyle = b.color;
        ctx.font = `bold ${b.r > 55 ? 17 : 14}px sans-serif`;
        ctx.textAlign = 'center';
        ctx.fillText(b.label, b.x, b.y + 5);
      }

      ctx.restore();
    }

    tryInteractCyberForge() {
      if (!this.cyberForge.active) return;
      const dist = Math.hypot(this.player.x - this.cyberForge.x, this.player.y - this.cyberForge.y);
      if (dist <= 110) {
        this.state = GAME_STATES.CYBER_FORGE;
      }
    }

    tryUpgradeWeapon() {
      if (!this.player) return;
      const upgraded = this.player.upgradeWeapon();
      if (upgraded) {
        const stats = this.player.getCurrentTierStats();
        this.scorePopups.push(new ScorePopup(
          this.player.x,
          this.player.y - 30,
          `UPGRADED: ${stats.tierName}!`,
          '#38bdf8',
          22
        ));
      }
    }

    spawnZombie(type, round) {
      const side = Math.floor(Math.random() * 4);
      let x, y;
      const margin = 20;

      if (side === 0) {
        x = Math.random() * (CONFIG.VIRTUAL_WIDTH - 200) + 100;
        y = margin;
      } else if (side === 1) {
        x = Math.random() * (CONFIG.VIRTUAL_WIDTH - 200) + 100;
        y = CONFIG.VIRTUAL_HEIGHT - margin;
      } else if (side === 2) {
        x = margin;
        y = Math.random() * (CONFIG.VIRTUAL_HEIGHT - 200) + 100;
      } else {
        x = CONFIG.VIRTUAL_WIDTH - margin;
        y = Math.random() * (CONFIG.VIRTUAL_HEIGHT - 200) + 100;
      }

      this.zombies.push(new Zombie(x, y, type, round, this.currentMapKey));
    }

    triggerExplosion(x, y, radius, damage) {
      audio.playExplosion();
      this.screenShake = 18 * settingsManager.data.screenShake;

      // Blast shockwave particles
      for (let i = 0; i < 28; i++) {
        const ang = Math.random() * Math.PI * 2;
        const spd = Math.random() * 260 + 80;
        this.particles.push(new Particle(
          x, y,
          Math.cos(ang) * spd,
          Math.sin(ang) * spd,
          i % 2 === 0 ? '#f97316' : '#ef4444',
          Math.random() * 4 + 3,
          0.45
        ));
      }

      // Damage monsters in radius
      for (let i = 0; i < this.zombies.length; i++) {
        const z = this.zombies[i];
        if (z.dead) continue;
        const d = Math.hypot(z.x - x, z.y - y);
        if (d <= radius) {
          const falloff = 1 - (d / radius);
          const finalDmg = damage * (0.4 + falloff * 0.6);
          z.takeDamage(finalDmg, 2.5, Math.atan2(z.y - y, z.x - x), true);
          sessionDashboard.recordDamage(finalDmg);

          if (z.dead) {
            this.player.totalKills++;
            this.player.score += z.archetype.scoreValue;
            sessionDashboard.recordKill(z.typeKey);
          }
        }
      }
    }

    loop(currentTime) {
      let dt = (currentTime - this.lastTime) / 1000;
      this.lastTime = currentTime;

      if (dt > 0.05) dt = 0.05;

      this.update(dt);
      if (this.state !== GAME_STATES.PLAYING && (this.input.moveStick.id !== null || this.input.aimStick.id !== null)) {
        this.input.resetTouchSticks();
      }
      this.input.endFrame();
      this.render();

      requestAnimationFrame(this.loop.bind(this));
    }

    update(dt) {
      if (this.state === GAME_STATES.HOME) {
        this.updateHome(dt);
      } else if (this.state === GAME_STATES.MAP_SELECT) {
        this.updateMapSelect(dt);
      } else if (this.state === GAME_STATES.PLAYING) {
        this.updatePlaying(dt);
      } else if (this.state === GAME_STATES.MENU) {
        this.updateMenu();
      } else if (this.state === GAME_STATES.SETTINGS) {
        this.updateSettings();
      } else if (this.state === GAME_STATES.QUIT_CONFIRM) {
        this.updateQuitConfirm();
      } else if (this.state === GAME_STATES.TERMINAL_SHUTDOWN) {
        this.updateTerminalShutdown();
      } else if (this.state === GAME_STATES.SHOP) {
        this.updateShop();
      } else if (this.state === GAME_STATES.CYBER_FORGE) {
        this.updateCyberForge();
      } else if (this.state === GAME_STATES.DASHBOARD) {
        this.updateDashboard();
      } else if (this.state === GAME_STATES.PAUSED) {
        this.updatePaused();
      } else if (this.state === GAME_STATES.GAME_OVER) {
        this.updateGameOver();
      }
    }

    updatePlaying(dt) {
      if (!this.player) return;

      const obstacles = (this.currentMap && this.currentMap.obstacles) ? this.currentMap.obstacles : ARENA_OBSTACLES;

      if (this.screenShake > 0) {
        this.screenShake = Math.max(0, this.screenShake - dt * 25);
      }

      // Update ambient weather
      this.updateArenaWeather(dt);

      // Update Operative with current map obstacles
      this.player.update(dt, this.input, obstacles, this.bullets, this.particles);

      // Check if Cyber-Forge should activate
      if (this.roundManager.round >= CONFIG.CYBER_FORGE_ROUND && !this.cyberForge.active) {
        this.cyberForge.activate();
        this.scorePopups.push(new ScorePopup(
          CONFIG.VIRTUAL_WIDTH / 2, 220,
          'CYBER-FORGE MACHINE ACTIVATED IN ARENA!',
          '#38bdf8', 26
        ));
      }
      this.cyberForge.update(dt);

      if (this.player.hp <= 0) {
        this.state = GAME_STATES.GAME_OVER;
        sessionDashboard.recordScore(this.player.score, this.roundManager.round);
        audio.playZombieDeath();
        return;
      }

      // Round Manager
      this.roundManager.update(
        dt,
        this.zombies.filter(z => !z.dead).length,
        (type, round) => this.spawnZombie(type, round),
        (clearedRound) => {
          const roundBonus = clearedRound * CONFIG.ROUND_BONUS_MULTIPLIER;
          this.player.score += roundBonus;
          sessionDashboard.recordScore(this.player.score, clearedRound);

          this.scorePopups.push(new ScorePopup(
            this.player.x,
            this.player.y - 40,
            `ROUND ${clearedRound} CLEARED! +${roundBonus} PTS`,
            '#22c55e',
            24
          ));
        }
      );

      // Bullets vs Obstacles & Monsters
      for (let i = this.bullets.length - 1; i >= 0; i--) {
        const b = this.bullets[i];
        b.update(dt);

        if (checkBulletObstacleHit(b, obstacles)) {
          b.dead = true;
          for (let s = 0; s < 4; s++) {
            this.particles.push(new Particle(
              b.x, b.y,
              (Math.random() - 0.5) * 120,
              (Math.random() - 0.5) * 120,
              '#fef08a',
              Math.random() * 2 + 1,
              0.2
            ));
          }
        }

        if (!b.dead) {
          for (let z = 0; z < this.zombies.length; z++) {
            const zombie = this.zombies[z];
            if (zombie.dead || b.hitEnemies.has(zombie)) continue;

            const dist = Math.hypot(b.x - zombie.x, b.y - zombie.y);
            if (dist <= zombie.radius + b.size) {
              b.hitEnemies.add(zombie);
              this.player.shotsHit++;
              this.player.score += CONFIG.HIT_SCORE;
              sessionDashboard.recordShot(true);
              sessionDashboard.recordDamage(b.damage);

              const shotAngle = Math.atan2(b.vy, b.vx);
              const isCryo = b.overclock === 'cryo';
              zombie.takeDamage(b.damage, b.knockback, shotAngle, b.incendiary, isCryo);
              audio.playHitZombie();

              // Micro-missile explosive overclock detonates
              if (b.overclock === 'explosive') {
                this.triggerExplosion(b.x, b.y, 80, b.damage * 0.85);
                b.dead = true;
              }

              // Tesla chain lightning
              if (b.overclock === 'tesla') {
                for (let k = 0; k < this.zombies.length; k++) {
                  const targetZ = this.zombies[k];
                  if (targetZ !== zombie && !targetZ.dead && Math.hypot(targetZ.x - zombie.x, targetZ.y - zombie.y) < 140) {
                    targetZ.takeDamage(b.damage * 0.65, 0.5, shotAngle, false, false);
                    this.particles.push(new Particle(targetZ.x, targetZ.y, 0, 0, '#c084fc', 4, 0.2));
                  }
                }
              }

              // Blood and gore particles (themed to regional monster color)
              const bloodColor = zombie.themeColor || zombie.archetype.color;
              for (let p = 0; p < 6; p++) {
                this.particles.push(new Particle(
                  zombie.x, zombie.y,
                  (Math.random() - 0.5) * 160 + b.vx * 0.1,
                  (Math.random() - 0.5) * 160 + b.vy * 0.1,
                  bloodColor,
                  Math.random() * 3 + 2,
                  0.35,
                  true
                ));
              }

              if (zombie.dead) {
                this.player.totalKills++;
                this.player.score += zombie.archetype.scoreValue;
                sessionDashboard.recordKill(zombie.typeKey);
                audio.playZombieDeath();

                this.scorePopups.push(new ScorePopup(
                  zombie.x,
                  zombie.y - 12,
                  `+${zombie.archetype.scoreValue}`,
                  '#facc15'
                ));

                if (Math.random() < CONFIG.DROP_CHANCE) {
                  const dropType = (this.player.hp < 70 && Math.random() < 0.5) ? 'medkit' : 'ammo';
                  this.pickups.push(new Pickup(zombie.x, zombie.y, dropType));
                }
              }

              if (b.pierce > 0) {
                b.pierce--;
              } else {
                b.dead = true;
                break;
              }
            }
          }
        }

        if (b.dead) {
          this.bullets.splice(i, 1);
        }
      }

      // Grenades update
      for (let i = this.grenades.length - 1; i >= 0; i--) {
        const g = this.grenades[i];
        g.update(dt);
        if (g.dead) {
          this.triggerExplosion(g.x, g.y, 160, 240);
          this.grenades.splice(i, 1);
        }
      }

      // Claymore Mines update
      for (let i = this.mines.length - 1; i >= 0; i--) {
        const m = this.mines[i];
        m.update(dt, this.zombies);
        if (m.dead) {
          this.triggerExplosion(m.x, m.y, 180, 320);
          this.mines.splice(i, 1);
        }
      }

      // Acid Pools update
      for (let i = this.acidPools.length - 1; i >= 0; i--) {
        const ap = this.acidPools[i];
        ap.life -= dt;
        ap.damageTimer -= dt;

        if (ap.damageTimer <= 0) {
          ap.damageTimer = 0.4;
          const d = Math.hypot(this.player.x - ap.x, this.player.y - ap.y);
          if (d <= ap.radius + this.player.radius) {
            this.player.takeDamage(12);
          }
        }

        if (ap.life <= 0) {
          this.acidPools.splice(i, 1);
        }
      }

      // Zombies update
      for (let i = this.zombies.length - 1; i >= 0; i--) {
        const z = this.zombies[i];
        if (z.dead) {
          this.zombies.splice(i, 1);
        } else {
          z.update(dt, this.player, this.zombies, obstacles, this.acidPools);
        }
      }

      // Pickups update
      for (let i = this.pickups.length - 1; i >= 0; i--) {
        const p = this.pickups[i];
        p.update(dt);

        const dist = Math.hypot(this.player.x - p.x, this.player.y - p.y);
        if (dist <= this.player.radius + p.radius) {
          if (p.type === 'medkit') {
            this.player.heal(CONFIG.MEDKIT_HEAL);
            this.scorePopups.push(new ScorePopup(p.x, p.y, `+${CONFIG.MEDKIT_HEAL} HP`, '#10b981', 20));
          } else {
            this.player.refillAmmo(CONFIG.AMMO_REFILL_PERCENT);
            this.scorePopups.push(new ScorePopup(p.x, p.y, `ALL WEAPONS AMMO REFILLED`, '#f59e0b', 20));
          }
          audio.playPickup();
          this.pickups.splice(i, 1);
        } else if (p.life <= 0) {
          this.pickups.splice(i, 1);
        }
      }

      // Particles update
      for (let i = this.particles.length - 1; i >= 0; i--) {
        const pt = this.particles[i];
        pt.update(dt);
        if (pt.life <= 0) this.particles.splice(i, 1);
      }

      // Score popups update
      for (let i = this.scorePopups.length - 1; i >= 0; i--) {
        const sp = this.scorePopups[i];
        sp.update(dt);
        if (sp.life <= 0) this.scorePopups.splice(i, 1);
      }

      // Live Session continuous score recording
      sessionDashboard.recordScore(this.player.score, this.roundManager.round);

      // Handle Interactive HUD Clicks with exact hitboxes
      if (this.input.wasClicked()) {
        const mx = this.input.mouse.x;
        const my = this.input.mouse.y;

        // Upgrade Banner Click
        const upBtnY = (this.roundManager && this.roundManager.isIntermission) ? 118 : 68;
        if (mx >= CONFIG.VIRTUAL_WIDTH / 2 - 160 && mx <= CONFIG.VIRTUAL_WIDTH / 2 + 160 &&
            my >= upBtnY && my <= upBtnY + 40) {
          this.tryUpgradeWeapon();
        }

        // Live Dashboard Button Click [TAB] (Top area: x: 1290..1425, y: 12..48)
        if (mx >= 1290 && mx <= 1425 && my >= 12 && my <= 48) {
          this.toggleDashboard();
        }

        // Armory Shop Button Click [B] (Top right area: x: 1440..1565, y: 12..48)
        if (mx >= 1440 && mx <= 1565 && my >= 12 && my <= 48) {
          this.toggleShop();
        }

        // Weapon Inventory Slots Click
        const invSlotW = 180;
        const invSlotH = 68;
        const invTotalW = 4 * invSlotW + 3 * 14;
        const invStartX = (CONFIG.VIRTUAL_WIDTH - invTotalW) / 2;
        const invY = CONFIG.VIRTUAL_HEIGHT - 82;

        if (my >= invY && my <= invY + invSlotH) {
          for (let i = 0; i < this.player.inventory.length; i++) {
            const sx = invStartX + i * (invSlotW + 14);
            if (mx >= sx && mx <= sx + invSlotW) {
              this.player.switchWeapon(this.player.inventory[i]);
            }
          }
        }
      }
    }

    // =======================================================================
    // 0. MAP & COMBAT THEATER SELECTION STATE
    // =======================================================================
    updateMapSelect(dt) {
      if (this.input.wasPressed('Escape')) {
        this.state = GAME_STATES.HOME;
        audio.playClick();
        return;
      }

      if (this.input.wasPressed('Digit1') || this.input.wasPressed('1')) { this.selectedMapKey = 'outpost'; audio.playClick(); }
      if (this.input.wasPressed('Digit2') || this.input.wasPressed('2')) { this.selectedMapKey = 'ice'; audio.playClick(); }
      if (this.input.wasPressed('Digit3') || this.input.wasPressed('3')) { this.selectedMapKey = 'jungle'; audio.playClick(); }
      if (this.input.wasPressed('Digit4') || this.input.wasPressed('4')) { this.selectedMapKey = 'desert'; audio.playClick(); }
      if (this.input.wasPressed('Digit5') || this.input.wasPressed('5')) { this.selectedMapKey = 'city'; audio.playClick(); }

      if (this.input.wasPressed('Space') || this.input.wasPressed('Enter')) {
        this.currentMapKey = this.selectedMapKey;
        this.currentMap = MAPS[this.selectedMapKey];
        this.state = GAME_STATES.MENU;
        audio.playClick();
        return;
      }

      if (this.input.wasClicked()) {
        const mx = this.input.mouse.x;
        const my = this.input.mouse.y;

        // Back to Homepage Button
        if (mx >= 40 && mx <= 260 && my >= 25 && my <= 70) {
          this.state = GAME_STATES.HOME;
          audio.playClick();
          return;
        }

        // 5 Map Cards
        const mapKeys = ['outpost', 'ice', 'jungle', 'desert', 'city'];
        const cardW = 286;
        const gap = 14;
        const totalW = 5 * cardW + 4 * gap;
        const startX = (CONFIG.VIRTUAL_WIDTH - totalW) / 2;
        const cardY = 126;
        const cardH = 566;

        for (let i = 0; i < mapKeys.length; i++) {
          const cx = startX + i * (cardW + gap);
          if (mx >= cx && mx <= cx + cardW && my >= cardY && my <= cardY + cardH) {
            this.selectedMapKey = mapKeys[i];
            this.currentMapKey = mapKeys[i];
            this.currentMap = MAPS[this.selectedMapKey];
            audio.playClick();
            break;
          }
        }

        // Continue to Loadout Button
        const btnW = 440;
        const btnH = 56;
        const btnX = (CONFIG.VIRTUAL_WIDTH - btnW) / 2;
        const btnY = 716;
        if (mx >= btnX && mx <= btnX + btnW && my >= btnY && my <= btnY + btnH) {
          this.currentMapKey = this.selectedMapKey;
          this.currentMap = MAPS[this.selectedMapKey];
          this.state = GAME_STATES.MENU;
          audio.playClick();
        }
      }
    }

    updateMenu() {
      if (this.input.wasPressed('Digit1') || this.input.wasPressed('1')) this.selectedWeaponKey = 'lmg';
      if (this.input.wasPressed('Digit2') || this.input.wasPressed('2')) this.selectedWeaponKey = 'smg';
      if (this.input.wasPressed('Digit3') || this.input.wasPressed('3')) this.selectedWeaponKey = 'shotgun';
      if (this.input.wasPressed('Digit4') || this.input.wasPressed('4')) this.selectedWeaponKey = 'pistols';

      if (this.input.wasPressed('KeyM') || this.input.wasPressed('m') || this.input.wasPressed('Escape')) {
        this.state = GAME_STATES.MAP_SELECT;
        audio.playClick();
        return;
      }

      if (this.input.wasPressed('Space') || this.input.wasPressed('Enter')) {
        this.startNewGame();
        return;
      }

      if (this.input.wasClicked()) {
        const mx = this.input.mouse.x;
        const my = this.input.mouse.y;

        // Back to Map Selection Button (Top Left)
        if (mx >= 40 && mx <= 270 && my >= 25 && my <= 70) {
          this.state = GAME_STATES.MAP_SELECT;
          audio.playClick();
          return;
        }

        // Change Map Badge Button (Top Right)
        if (mx >= CONFIG.VIRTUAL_WIDTH - 300 && mx <= CONFIG.VIRTUAL_WIDTH - 40 && my >= 25 && my <= 70) {
          this.state = GAME_STATES.MAP_SELECT;
          audio.playClick();
          return;
        }

        const cardKeys = ['lmg', 'smg', 'shotgun', 'pistols'];
        const cardW = 320;
        const cardH = 360;
        const startX = (CONFIG.VIRTUAL_WIDTH - (4 * cardW + 3 * 20)) / 2;
        const cardY = 300;

        for (let i = 0; i < cardKeys.length; i++) {
          const cx = startX + i * (cardW + 20);
          if (mx >= cx && mx <= cx + cardW && my >= cardY && my <= cardY + cardH) {
            this.selectedWeaponKey = cardKeys[i];
            audio.playShoot(this.selectedWeaponKey, 0);
          }
        }

        const btnW = 340;
        const btnH = 65;
        const btnX = (CONFIG.VIRTUAL_WIDTH - btnW) / 2;
        const btnY = 710;
        if (mx >= btnX && mx <= btnX + btnW && my >= btnY && my <= btnY + btnH) {
          this.startNewGame();
        }
      }
    }

    updateShop() {
      if (this.input.wasClicked()) {
        const mx = this.input.mouse.x;
        const my = this.input.mouse.y;

        // Close button
        if (mx >= CONFIG.VIRTUAL_WIDTH / 2 + 340 && mx <= CONFIG.VIRTUAL_WIDTH / 2 + 390 &&
            my >= 135 && my <= 175) {
          this.state = GAME_STATES.PLAYING;
          return;
        }

        // Shop items: Medkit, Armor, Ammo, Grenade, Mine, Adrenaline
        const items = [
          { key: 'medkit', name: 'Combat Medkit (+50 HP)', cost: CONFIG.SHOP_PRICES.medkit, action: () => { this.player.heal(50); } },
          { key: 'armor', name: 'Heavy Kevlar Armor (+50 Armor)', cost: CONFIG.SHOP_PRICES.armor, action: () => { this.player.repairArmor(50); } },
          { key: 'ammo', name: 'Universal Ammo Pack (100% Reserves)', cost: CONFIG.SHOP_PRICES.ammo, action: () => { this.player.refillAmmo(1.0); } },
          { key: 'grenade', name: 'Frag Grenade Pack (+2 Grenades)', cost: CONFIG.SHOP_PRICES.grenade, action: () => { this.player.grenades += 2; } },
          { key: 'mine', name: 'Claymore Mine (+1 Claymore)', cost: CONFIG.SHOP_PRICES.mine, action: () => { this.player.mines += 1; } },
          { key: 'adrenaline', name: 'Adrenaline Surge (Speed +30% for 35s)', cost: CONFIG.SHOP_PRICES.adrenaline, action: () => { this.player.adrenalineTimer = 35; } }
        ];

        const startY = 220;
        const itemH = 65;
        const itemW = 740;
        const startX = (CONFIG.VIRTUAL_WIDTH - itemW) / 2;

        for (let i = 0; i < items.length; i++) {
          const iy = startY + i * (itemH + 12);
          const btnX = startX + itemW - 130;
          const btnY = iy + 14;

          if (mx >= btnX && mx <= btnX + 115 && my >= btnY && my <= btnY + 38) {
            const item = items[i];
            if (this.player.score >= item.cost) {
              this.player.score -= item.cost;
              item.action();
              audio.playBuy();
              sessionDashboard.sessionData.itemsPurchased++;
              sessionDashboard.save();
              this.scorePopups.push(new ScorePopup(this.player.x, this.player.y - 30, `PURCHASED: ${item.name}`, '#22c55e', 20));
            }
          }
        }
      }
    }

    updateCyberForge() {
      if (this.input.wasClicked()) {
        const mx = this.input.mouse.x;
        const my = this.input.mouse.y;

        // Close button
        if (mx >= CONFIG.VIRTUAL_WIDTH / 2 + 340 && mx <= CONFIG.VIRTUAL_WIDTH / 2 + 390 &&
            my >= 135 && my <= 175) {
          this.state = GAME_STATES.PLAYING;
          return;
        }

        const overclocks = Object.values(CYBER_OVERCLOCKS);
        const cardW = 350;
        const cardH = 220;
        const startX = (CONFIG.VIRTUAL_WIDTH - (2 * cardW + 24)) / 2;
        const startY = 220;

        for (let i = 0; i < overclocks.length; i++) {
          const oc = overclocks[i];
          const col = i % 2;
          const row = Math.floor(i / 2);
          const cx = startX + col * (cardW + 24);
          const cy = startY + row * (cardH + 20);

          const btnX = cx + cardW - 140;
          const btnY = cy + cardH - 50;

          if (mx >= btnX && mx <= btnX + 125 && my >= btnY && my <= btnY + 38) {
            const success = this.player.applyCyberOverclock(oc.id);
            if (success) {
              this.scorePopups.push(new ScorePopup(this.player.x, this.player.y - 35, `OVERCLOCKED: ${oc.name}!`, oc.color, 24));
              this.state = GAME_STATES.PLAYING;
              return;
            }
          }
        }
      }
    }

    updateDashboard() {
      if (this.input.wasClicked()) {
        const mx = this.input.mouse.x;
        const my = this.input.mouse.y;

        // Close button
        if (mx >= CONFIG.VIRTUAL_WIDTH / 2 + 360 && mx <= CONFIG.VIRTUAL_WIDTH / 2 + 410 &&
            my >= 120 && my <= 160) {
          this.state = this.previousState || GAME_STATES.PLAYING;
          return;
        }

        // Reset Session Button
        if (mx >= CONFIG.VIRTUAL_WIDTH / 2 - 120 && mx <= CONFIG.VIRTUAL_WIDTH / 2 + 120 &&
            my >= 730 && my <= 775) {
          sessionDashboard.reset();
        }
      }
    }

    updatePaused() {
      if (this.input.wasClicked()) {
        const mx = this.input.mouse.x;
        const my = this.input.mouse.y;

        // Resume Button
        if (mx >= CONFIG.VIRTUAL_WIDTH / 2 - 140 && mx <= CONFIG.VIRTUAL_WIDTH / 2 + 140 &&
            my >= 480 && my <= 535) {
          this.state = GAME_STATES.PLAYING;
        }

        // Main Menu Button
        if (mx >= CONFIG.VIRTUAL_WIDTH / 2 - 140 && mx <= CONFIG.VIRTUAL_WIDTH / 2 + 140 &&
            my >= 555 && my <= 610) {
          this.state = GAME_STATES.HOME;
          audio.playClick();
        }
      }
    }

    updateGameOver() {
      if (this.input.wasPressed('Space') || this.input.wasPressed('Enter')) {
        this.startNewGame();
        return;
      }

      if (this.input.wasClicked()) {
        const mx = this.input.mouse.x;
        const my = this.input.mouse.y;

        if (mx >= CONFIG.VIRTUAL_WIDTH / 2 - 150 && mx <= CONFIG.VIRTUAL_WIDTH / 2 + 150 &&
            my >= 610 && my <= 670) {
          this.startNewGame();
        }

        if (mx >= CONFIG.VIRTUAL_WIDTH / 2 - 150 && mx <= CONFIG.VIRTUAL_WIDTH / 2 + 150 &&
            my >= 685 && my <= 740) {
          this.state = GAME_STATES.HOME;
          audio.playClick();
        }
      }
    }

    // =======================================================================
    // RENDERING PIPELINE
    // =======================================================================
    render() {
      const ctx = this.ctx;
      ctx.save();

      if (this.screenShake > 0) {
        const shakeX = (Math.random() - 0.5) * this.screenShake;
        const shakeY = (Math.random() - 0.5) * this.screenShake;
        ctx.translate(shakeX, shakeY);
      }

      this.drawArena(ctx);

      if (this.state === GAME_STATES.PLAYING || this.state === GAME_STATES.PAUSED ||
          this.state === GAME_STATES.SHOP || this.state === GAME_STATES.CYBER_FORGE ||
          this.state === GAME_STATES.DASHBOARD || this.state === GAME_STATES.GAME_OVER) {

        // Draw Cyber-Forge Machine
        const pDist = this.player ? Math.hypot(this.player.x - this.cyberForge.x, this.player.y - this.cyberForge.y) : 999;
        this.cyberForge.draw(ctx, pDist);

        // Draw Acid Pools
        for (let i = 0; i < this.acidPools.length; i++) {
          const ap = this.acidPools[i];
          ctx.fillStyle = 'rgba(16, 185, 129, 0.45)';
          ctx.beginPath();
          ctx.arc(ap.x, ap.y, ap.radius, 0, Math.PI * 2);
          ctx.fill();
        }

        // Draw Pickups
        for (let i = 0; i < this.pickups.length; i++) this.pickups[i].draw(ctx);

        // Draw Claymore Mines & Grenades
        for (let i = 0; i < this.mines.length; i++) this.mines[i].draw(ctx);
        for (let i = 0; i < this.grenades.length; i++) this.grenades[i].draw(ctx);

        // Draw Zombies
        for (let i = 0; i < this.zombies.length; i++) this.zombies[i].draw(ctx);

        // Draw Operative
        if (this.player) this.player.draw(ctx);

        // Draw Bullets & Particles
        for (let i = 0; i < this.bullets.length; i++) this.bullets[i].draw(ctx);
        for (let i = 0; i < this.particles.length; i++) this.particles[i].draw(ctx);
        for (let i = 0; i < this.scorePopups.length; i++) this.scorePopups[i].draw(ctx);

        this.drawHUD(ctx);
      }

      ctx.restore();

      // Modal Overlays
      if (this.state === GAME_STATES.HOME) {
        this.drawHome(ctx);
      } else if (this.state === GAME_STATES.MAP_SELECT) {
        this.drawMapSelect(ctx);
      } else if (this.state === GAME_STATES.SETTINGS) {
        this.drawSettings(ctx);
      } else if (this.state === GAME_STATES.QUIT_CONFIRM) {
        this.drawQuitConfirm(ctx);
      } else if (this.state === GAME_STATES.TERMINAL_SHUTDOWN) {
        this.drawTerminalShutdown(ctx);
      } else if (this.state === GAME_STATES.MENU) {
        this.drawMenu(ctx);
      } else if (this.state === GAME_STATES.SHOP) {
        this.drawShop(ctx);
      } else if (this.state === GAME_STATES.CYBER_FORGE) {
        this.drawCyberForge(ctx);
      } else if (this.state === GAME_STATES.DASHBOARD) {
        this.drawDashboard(ctx);
      } else if (this.state === GAME_STATES.PAUSED) {
        this.drawPaused(ctx);
      } else if (this.state === GAME_STATES.GAME_OVER) {
        this.drawGameOver(ctx);
      }

      if (IS_TOUCH && this.state === GAME_STATES.PLAYING && this.player) {
        this.drawTouchControls(ctx);
      }

      if (!IS_TOUCH) this.drawCrosshair(ctx);
    }

    drawArena(ctx) {
      const map = this.currentMap || MAPS.outpost;

      // 1. Biome Base Floor
      ctx.fillStyle = map.floorColor;
      ctx.fillRect(0, 0, CONFIG.VIRTUAL_WIDTH, CONFIG.VIRTUAL_HEIGHT);

      // 2. Biome Grid Pattern
      ctx.strokeStyle = map.gridColor;
      ctx.lineWidth = 1;
      const gridSize = 64;
      for (let x = 0; x < CONFIG.VIRTUAL_WIDTH; x += gridSize) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, CONFIG.VIRTUAL_HEIGHT);
        ctx.stroke();
      }
      for (let y = 0; y < CONFIG.VIRTUAL_HEIGHT; y += gridSize) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(CONFIG.VIRTUAL_WIDTH, y);
        ctx.stroke();
      }

      // 3. Biome-Specific Floor Details
      ctx.save();
      if (map.id === 'ice') {
        // Glacial permafrost ice cracks & frost sheen
        ctx.strokeStyle = 'rgba(34, 211, 238, 0.18)';
        ctx.lineWidth = 2;
        const cracks = [
          [200, 250, 340, 310, 420, 270, 500, 340],
          [1100, 300, 1180, 380, 1260, 350, 1380, 420],
          [400, 680, 480, 720, 560, 690, 680, 750],
          [900, 660, 980, 710, 1060, 680, 1140, 730]
        ];
        for (let c = 0; c < cracks.length; c++) {
          const pts = cracks[c];
          ctx.beginPath();
          ctx.moveTo(pts[0], pts[1]);
          for (let p = 2; p < pts.length; p += 2) ctx.lineTo(pts[p], pts[p + 1]);
          ctx.stroke();
        }
      } else if (map.id === 'jungle') {
        // Mutated moss flagstones & bio-fungal spore clusters
        ctx.fillStyle = 'rgba(21, 128, 61, 0.15)';
        const patches = [
          { x: 300, y: 320, r: 85 }, { x: 1200, y: 480, r: 95 },
          { x: 700, y: 220, r: 75 }, { x: 880, y: 680, r: 90 }
        ];
        for (let i = 0; i < patches.length; i++) {
          ctx.beginPath();
          ctx.arc(patches[i].x, patches[i].y, patches[i].r, 0, Math.PI * 2);
          ctx.fill();
        }
      } else if (map.id === 'desert') {
        // Desert sand ripples & adobe ruins dust
        ctx.strokeStyle = 'rgba(245, 158, 11, 0.16)';
        ctx.lineWidth = 1.5;
        for (let y = 140; y < CONFIG.VIRTUAL_HEIGHT - 100; y += 90) {
          ctx.beginPath();
          ctx.moveTo(80, y);
          for (let x = 80; x < CONFIG.VIRTUAL_WIDTH - 80; x += 80) {
            ctx.quadraticCurveTo(x + 40, y + ((x / 80) % 2 === 0 ? 8 : -8), x + 80, y);
          }
          ctx.stroke();
        }
      } else if (map.id === 'city') {
        // Quarantined asphalt streets & yellow roadway dividing lines
        ctx.strokeStyle = 'rgba(234, 179, 8, 0.28)';
        ctx.lineWidth = 3;
        ctx.setLineDash([28, 28]);
        ctx.beginPath();
        ctx.moveTo(100, CONFIG.VIRTUAL_HEIGHT / 2);
        ctx.lineTo(CONFIG.VIRTUAL_WIDTH - 100, CONFIG.VIRTUAL_HEIGHT / 2);
        ctx.stroke();
        ctx.setLineDash([]);
      } else {
        // Outpost Zero: Glowing conduit lines
        ctx.strokeStyle = 'rgba(56, 189, 248, 0.22)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(80, 450); ctx.lineTo(1520, 450);
        ctx.moveTo(800, 80); ctx.lineTo(800, 820);
        ctx.stroke();
      }
      ctx.restore();

      // 4. Outer Arena Boundary Walls
      ctx.lineWidth = 14;
      ctx.strokeStyle = map.wallColor;
      ctx.strokeRect(35, 35, CONFIG.VIRTUAL_WIDTH - 70, CONFIG.VIRTUAL_HEIGHT - 70);

      ctx.lineWidth = 4;
      ctx.strokeStyle = map.wallBorder;
      ctx.setLineDash([16, 16]);
      ctx.strokeRect(42, 42, CONFIG.VIRTUAL_WIDTH - 84, CONFIG.VIRTUAL_HEIGHT - 84);
      ctx.setLineDash([]);

      // 5. Themed Obstacles
      const obstacles = map.obstacles || ARENA_OBSTACLES;
      for (let i = 0; i < obstacles.length; i++) {
        const b = obstacles[i];
        // Shadow
        ctx.fillStyle = 'rgba(0, 0, 0, 0.65)';
        ctx.fillRect(b.x + 6, b.y + 6, b.w, b.h);

        // Body
        ctx.fillStyle = b.color || map.wallColor;
        ctx.strokeStyle = b.border || map.wallBorder;
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.roundRect(b.x, b.y, b.w, b.h, 6);
        ctx.fill();
        ctx.stroke();

        // Inner inset
        ctx.fillStyle = map.floorColor;
        ctx.fillRect(b.x + 6, b.y + 6, b.w - 12, b.h - 12);

        // Tactical label
        ctx.fillStyle = b.border || map.accentColor;
        ctx.font = 'bold 11px monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(b.label, b.x + b.w / 2, b.y + b.h / 2);
      }

      // 6. Ambient Biome Weather Particles (Snow, Spores, Dust, Rain, Embers)
      this.drawArenaWeather(ctx);
    }

    drawHUD(ctx) {
      if (!this.player || !this.roundManager) return;
      const stats = this.player.getCurrentTierStats();
      const oc = this.player.currentOverclock ? CYBER_OVERCLOCKS[this.player.currentOverclock] : null;

      // Top HUD Bar Background
      ctx.fillStyle = 'rgba(10, 14, 23, 0.88)';
      ctx.fillRect(0, 0, CONFIG.VIRTUAL_WIDTH, 60);
      ctx.strokeStyle = '#1e293b';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(0, 60);
      ctx.lineTo(CONFIG.VIRTUAL_WIDTH, 60);
      ctx.stroke();

      // 1. HEALTH & ARMOR BARS (Top Left: x = 36 to 290)
      ctx.fillStyle = '#64748b';
      ctx.font = 'bold 11px sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText('OPERATIVE VITALS', 36, 17);

      const hpW = 140;
      const hpH = 13;
      const hpPct = Math.max(0, this.player.hp / this.player.maxHp);
      ctx.fillStyle = '#1e293b';
      ctx.fillRect(36, 23, hpW, hpH);
      ctx.fillStyle = hpPct > 0.5 ? '#22c55e' : (hpPct > 0.25 ? '#eab308' : '#ef4444');
      ctx.fillRect(36, 23, hpW * hpPct, hpH);
      ctx.strokeStyle = '#334155';
      ctx.strokeRect(36, 23, hpW, hpH);

      // Armor Shield Bar
      const armorPct = Math.max(0, this.player.armor / this.player.maxArmor);
      ctx.fillStyle = '#1e293b';
      ctx.fillRect(36, 40, hpW, 8);
      ctx.fillStyle = '#38bdf8';
      ctx.fillRect(36, 40, hpW * armorPct, 8);
      ctx.strokeStyle = '#0284c7';
      ctx.strokeRect(36, 40, hpW, 8);

      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 11px monospace';
      ctx.fillText(`HP ${Math.round(this.player.hp)}`, 186, 33);
      ctx.fillStyle = '#38bdf8';
      ctx.fillText(`SHIELD ${Math.round(this.player.armor)}`, 186, 48);

      // 2. ACTIVE COMBAT ZONE & BIOME PERK (Top Left-Center: x = 300 to 580)
      const mapObj = this.currentMap || MAPS.outpost;
      ctx.save();
      ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
      ctx.beginPath();
      ctx.roundRect(300, 11, 260, 40, 6);
      ctx.fill();
      ctx.strokeStyle = mapObj.accentColor || '#38bdf8';
      ctx.lineWidth = 1.2;
      ctx.stroke();

      ctx.textAlign = 'left';
      ctx.fillStyle = mapObj.accentColor || '#38bdf8';
      ctx.font = 'bold 12px sans-serif';
      ctx.fillText(`MAP: ${mapObj.name.toUpperCase()}`, 312, 27);

      ctx.fillStyle = '#fef08a';
      ctx.font = 'bold 10px monospace';
      ctx.fillText(`BONUS: ${mapObj.perkName}`, 312, 43);
      ctx.restore();

      // 3. ROUND & REMAINING ENEMIES (Top Center: x = 800)
      ctx.textAlign = 'center';
      ctx.fillStyle = '#ef4444';
      ctx.font = 'bold 22px sans-serif';
      ctx.fillText(`ROUND ${this.roundManager.round}`, CONFIG.VIRTUAL_WIDTH / 2, 27);

      const aliveCount = this.zombies.filter(z => !z.dead).length;
      const remainingTotal = (this.roundManager.totalEnemiesForRound - this.roundManager.enemiesSpawnedThisRound) + aliveCount;
      ctx.fillStyle = '#94a3b8';
      ctx.font = '12px sans-serif';
      ctx.fillText(`ZOMBIES LEFT: ${remainingTotal}`, CONFIG.VIRTUAL_WIDTH / 2, 46);

      // 4. SCORE & KILLS (Top Right-Center: x = 1040 to 1265)
      ctx.textAlign = 'right';
      ctx.fillStyle = '#f59e0b';
      ctx.font = 'bold 22px monospace';
      ctx.fillText(`${this.player.score.toLocaleString()} PTS`, 1265, 30);
      ctx.fillStyle = '#94a3b8';
      ctx.font = '11px monospace';
      ctx.fillText(`KILLS: ${this.player.totalKills}`, 1265, 47);

      // 5. Live Dashboard Button [TAB] (x = 1290 to 1425, y = 12 to 48)
      ctx.save();
      ctx.fillStyle = 'rgba(30, 41, 59, 0.95)';
      ctx.beginPath();
      ctx.roundRect(1290, 12, 135, 36, 6);
      ctx.fill();
      ctx.strokeStyle = '#38bdf8';
      ctx.lineWidth = 1.5;
      ctx.stroke();

      ctx.textAlign = 'center';
      ctx.fillStyle = '#38bdf8';
      ctx.font = 'bold 12px sans-serif';
      ctx.fillText('STATS [TAB]', 1357, 35);
      ctx.restore();

      // 6. Armory Shop Button [B] (x = 1440 to 1565, y = 12 to 48)
      ctx.save();
      ctx.fillStyle = 'rgba(234, 88, 12, 0.95)';
      ctx.beginPath();
      ctx.roundRect(1440, 12, 125, 36, 6);
      ctx.fill();
      ctx.strokeStyle = '#f97316';
      ctx.lineWidth = 1.5;
      ctx.stroke();

      ctx.textAlign = 'center';
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 12px sans-serif';
      ctx.fillText('SHOP [B]', 1502, 35);
      ctx.restore();

      // 4. WEAPON INVENTORY BAR (Bottom Center)
      const invSlotW = 180;
      const invSlotH = 68;
      const invTotalW = 4 * invSlotW + 3 * 14;
      const invStartX = (CONFIG.VIRTUAL_WIDTH - invTotalW) / 2;
      const invY = CONFIG.VIRTUAL_HEIGHT - 82;

      for (let i = 0; i < this.player.inventory.length; i++) {
        const wKey = this.player.inventory[i];
        const wDef = WEAPONS[wKey];
        const wState = this.player.weaponsState[wKey];
        const wStats = wDef.tiers[wState.tierIndex];
        const isActive = this.player.activeWeaponKey === wKey;
        const sx = invStartX + i * (invSlotW + 14);

        ctx.save();
        ctx.fillStyle = isActive ? 'rgba(30, 41, 59, 0.95)' : 'rgba(15, 23, 42, 0.85)';
        ctx.strokeStyle = isActive ? '#38bdf8' : '#334155';
        ctx.lineWidth = isActive ? 2.5 : 1;
        ctx.beginPath();
        ctx.roundRect(sx, invY, invSlotW, invSlotH, 6);
        ctx.fill();
        ctx.stroke();

        if (isActive) {
          ctx.strokeStyle = 'rgba(56, 189, 248, 0.35)';
          ctx.lineWidth = 6;
          ctx.stroke();
        }

        ctx.fillStyle = isActive ? '#38bdf8' : '#64748b';
        ctx.font = 'bold 12px monospace';
        ctx.textAlign = 'left';
        ctx.fillText(`[${i + 1}] ${wDef.shortName}`, sx + 10, invY + 20);

        ctx.fillStyle = wState.overclock ? CYBER_OVERCLOCKS[wState.overclock].color : '#94a3b8';
        ctx.font = 'bold 10px sans-serif';
        ctx.textAlign = 'right';
        ctx.fillText(wState.overclock ? 'CYBER-V' : `MK-${wState.tierIndex + 1}`, sx + invSlotW - 10, invY + 20);

        ctx.fillStyle = isActive ? '#ffffff' : '#94a3b8';
        ctx.font = 'bold 13px sans-serif';
        ctx.textAlign = 'left';
        ctx.fillText(wDef.name, sx + 10, invY + 38);

        const resText = wStats.maxReserve === Infinity ? '∞' : wState.reserveAmmo;
        ctx.fillStyle = wState.magAmmo === 0 ? '#ef4444' : (isActive ? '#38bdf8' : '#cbd5e1');
        ctx.font = 'bold 15px monospace';
        ctx.fillText(`${wState.magAmmo} / ${resText}`, sx + 10, invY + 58);

        if (isActive) {
          ctx.fillStyle = '#22c55e';

    // =======================================================================
    // BLOODY "OUTPOST ZERO" TITLE RENDERER
    // Features distressed armor plate, hazard diagonal caution bars,
    // claw slash scratches, layered crimson gradient, and dripping blood.
    // =======================================================================
    drawBloodyTitle(ctx, x, y, scale = 1.0, showSubtitle = true) {
      ctx.save();
      ctx.translate(x, y);

      const plateW = 920 * scale;
      const plateH = (showSubtitle ? 190 : 130) * scale;

      // Armored Backing Plate
      ctx.fillStyle = '#060a12';
      ctx.beginPath();
      ctx.roundRect(-plateW / 2, -plateH / 2, plateW, plateH, 10 * scale);
      ctx.fill();
      ctx.strokeStyle = '#261118';
      ctx.lineWidth = 3 * scale;
      ctx.stroke();

      // Hazard Diagonal Warning Stripes on top and bottom borders
      ctx.save();
      ctx.beginPath();
      ctx.rect(-plateW / 2 + 4, -plateH / 2 + 3, plateW - 8, 8 * scale);
      ctx.rect(-plateW / 2 + 4, plateH / 2 - 11 * scale, plateW - 8, 8 * scale);
      ctx.clip();
      const stripeW = 16 * scale;
      for (let sx = -plateW / 2 - 20; sx < plateW / 2 + 20; sx += stripeW * 2) {
        ctx.fillStyle = '#eab308';
        ctx.beginPath();
        ctx.moveTo(sx, -plateH);
        ctx.lineTo(sx + stripeW, -plateH);
        ctx.lineTo(sx + stripeW - 20, plateH);
        ctx.lineTo(sx - 20, plateH);
        ctx.fill();
        ctx.fillStyle = '#09090b';
        ctx.beginPath();
        ctx.moveTo(sx + stripeW, -plateH);
        ctx.lineTo(sx + stripeW * 2, -plateH);
        ctx.lineTo(sx + stripeW * 2 - 20, plateH);
        ctx.lineTo(sx - 20, plateH);
        ctx.fill();
      }
      ctx.restore();

      // Biohazard Insignia Watermark in dark crimson behind text
      ctx.save();
      ctx.globalAlpha = 0.18;
      ctx.fillStyle = '#ef4444';
      ctx.font = `bold ${Math.round(140 * scale)}px sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('☣', 0, -5 * scale);
      ctx.restore();

      // Violent Claw Marks / Slash Scratches across the plate
      ctx.save();
      const slashes = [
        { x1: -plateW * 0.38, y1: -plateH * 0.22, x2: plateW * 0.42, y2: plateH * 0.18, w: 4.5 * scale },
        { x1: -plateW * 0.34, y1: -plateH * 0.26, x2: plateW * 0.46, y2: plateH * 0.12, w: 3 * scale },
        { x1: -plateW * 0.42, y1: -plateH * 0.14, x2: plateW * 0.38, y2: plateH * 0.22, w: 2 * scale }
      ];
      for (let i = 0; i < slashes.length; i++) {
        const sl = slashes[i];
        ctx.strokeStyle = 'rgba(153, 27, 27, 0.75)';
        ctx.lineWidth = sl.w;
        ctx.beginPath();
        ctx.moveTo(sl.x1, sl.y1);
        ctx.lineTo(sl.x2, sl.y2);
        ctx.stroke();

        ctx.strokeStyle = 'rgba(239, 68, 68, 0.4)';
        ctx.lineWidth = sl.w * 0.4;
        ctx.beginPath();
        ctx.moveTo(sl.x1 - 1, sl.y1 - 1);
        ctx.lineTo(sl.x2 - 1, sl.y2 - 1);
        ctx.stroke();
      }
      ctx.restore();

      // Random dried blood splatter droplets on the metal
      ctx.save();
      const bloodSpots = [
        { x: -360, y: -45, r: 5.5 }, { x: -350, y: -38, r: 3 }, { x: -370, y: -32, r: 2.2 },
        { x: 380, y: 35, r: 6 }, { x: 395, y: 25, r: 3.5 }, { x: 370, y: 45, r: 2.5 },
        { x: -140, y: 55, r: 4 }, { x: 160, y: -58, r: 4.5 }, { x: -25, y: 62, r: 3 }
      ];
      ctx.fillStyle = '#7f1d1d';
      for (let i = 0; i < bloodSpots.length; i++) {
        const sp = bloodSpots[i];
        ctx.beginPath();
        ctx.arc(sp.x * scale, sp.y * scale, sp.r * scale, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();

      // Top Alert Badge


      // Title Text: OUTPOST ZERO (Great & Bloody Typography)
      const titleY = (showSubtitle ? 15 : 12) * scale;
      const fontSize = Math.round(76 * scale);
      ctx.font = `900 ${fontSize}px -apple-system, BlinkMacSystemFont, "Impact", "Arial Black", sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      // 1. Dark Coagulated Blood Deep Shadow
      ctx.fillStyle = '#2b0707';
      ctx.fillText('OUTPOST ZERO', 0, titleY + 7 * scale);

      // 2. Dried Blood Mid-Shadow
      ctx.fillStyle = '#7f1d1d';
      ctx.fillText('OUTPOST ZERO', 0, titleY + 3.5 * scale);

      // 3. Bloody Face Gradient (Arterial Red -> Crimson -> Deep Blood)
      const grad = ctx.createLinearGradient(0, titleY - 38 * scale, 0, titleY + 35 * scale);
      grad.addColorStop(0, '#fca5a5');   // Light bone/flesh highlight
      grad.addColorStop(0.2, '#ef4444'); // Fresh arterial red
      grad.addColorStop(0.65, '#b91c1c');// Deep crimson
      grad.addColorStop(1, '#450a0a');   // Coagulated dried blood
      ctx.fillStyle = grad;
      ctx.fillText('OUTPOST ZERO', 0, titleY);

      // 4. Subtle Outer Stroke
      ctx.strokeStyle = 'rgba(254, 202, 202, 0.45)';
      ctx.lineWidth = 1 * scale;
      ctx.strokeText('OUTPOST ZERO', 0, titleY);

      // 5. ORGANIC DRIPPING BLOOD EFFECTS
      const dripOffsets = [
        { x: -330, len: 26, r: 4.2 },
        { x: -285, len: 16, r: 3.2 },
        { x: -230, len: 32, r: 4.8 },
        { x: -160, len: 22, r: 3.8 },
        { x: -105, len: 38, r: 5.2 },
        { x: -45,  len: 18, r: 3.5 },
        { x: 30,   len: 28, r: 4.5 },
        { x: 95,   len: 20, r: 3.6 },
        { x: 160,  len: 34, r: 5.0 },
        { x: 235,  len: 19, r: 3.4 },
        { x: 295,  len: 30, r: 4.6 },
        { x: 345,  len: 15, r: 3.0 }
      ];

      const time = Date.now() * 0.003;
      for (let i = 0; i < dripOffsets.length; i++) {
        const d = dripOffsets[i];
        const dx = d.x * scale;
        const baseY = titleY + 28 * scale;
        const dynamicLen = (d.len + Math.sin(time + i * 1.5) * 4) * scale;
        const dropR = d.r * scale;

        ctx.fillStyle = '#991b1b';
        ctx.beginPath();
        ctx.moveTo(dx - dropR * 0.55, baseY);
        ctx.lineTo(dx - dropR * 0.25, baseY + dynamicLen - dropR);
        ctx.arc(dx, baseY + dynamicLen, dropR, 0, Math.PI);
        ctx.lineTo(dx + dropR * 0.55, baseY);
        ctx.closePath();
        ctx.fill();

        // Droplet specular shine
        ctx.fillStyle = 'rgba(255, 255, 255, 0.45)';
        ctx.beginPath();
        ctx.arc(dx - dropR * 0.25, baseY + dynamicLen - dropR * 0.25, dropR * 0.35, 0, Math.PI * 2);
        ctx.fill();

        // Dynamic falling drop
        if (i % 4 === 0) {
          const dropCycle = (time * 0.8 + i) % 3;
          if (dropCycle > 1.8) {
            const fallProgress = (dropCycle - 1.8) / 1.2;
            const dropY = baseY + dynamicLen + fallProgress * 30 * scale;
            ctx.fillStyle = '#b91c1c';
            ctx.beginPath();
            ctx.arc(dx, dropY, dropR * 0.75, 0, Math.PI * 2);
            ctx.fill();
          }
        }
      }

      // Subtitle Banner
      if (showSubtitle) {
        ctx.textAlign = 'center';
        ctx.textBaseline = 'alphabetic';
        ctx.font = `bold ${Math.round(15 * scale)}px sans-serif`;
        const subText = 'SURVIVE ENDLESS ROUNDS OF ZOMBIES';
        const subW = ctx.measureText(subText).width + 36 * scale;
        const subH = 26 * scale;
        const subY = plateH * 0.38;
        ctx.fillStyle = 'rgba(5, 7, 13, 0.95)';
        ctx.beginPath();
        ctx.roundRect(-subW / 2, subY - subH * 0.72, subW, subH, 5 * scale);
        ctx.fill();
        ctx.fillStyle = '#38bdf8';
        ctx.fillText(subText, 0, subY);
      }

      ctx.restore();
    }

    // =======================================================================
    // 1. HOMEPAGE & MAIN MENU STATE
    // =======================================================================
    updateHome(dt) {
      // Animate ambient embers
      for (let i = 0; i < this.homeEmberParticles.length; i++) {
        const p = this.homeEmberParticles[i];
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        if (p.y < -20) {
          p.y = CONFIG.VIRTUAL_HEIGHT + 10;
          p.x = Math.random() * CONFIG.VIRTUAL_WIDTH;
        }
      }

      // Keyboard hotkeys
      if (this.input.wasPressed('Space') || this.input.wasPressed('Enter')) {
        this.state = GAME_STATES.MAP_SELECT;
        audio.playClick();
        return;
      }
      if (this.input.wasPressed('KeyS') || this.input.wasPressed('s')) {
        this.state = GAME_STATES.SETTINGS;
        audio.playClick();
        return;
      }
      if (this.input.wasPressed('KeyQ') || this.input.wasPressed('q')) {
        this.state = GAME_STATES.QUIT_CONFIRM;
        audio.playClick();
        return;
      }

      if (this.input.wasClicked()) {
        const mx = this.input.mouse.x;
        const my = this.input.mouse.y;

        const btnW = 460;
        const btnH = 66;
        const btnX = (CONFIG.VIRTUAL_WIDTH - btnW) / 2;

        // Button 1: START GAME (y = 350)
        if (mx >= btnX && mx <= btnX + btnW && my >= 350 && my <= 350 + btnH) {
          this.state = GAME_STATES.MAP_SELECT;
          audio.playClick();
          return;
        }

        // Button 2: SETTINGS (y = 432)
        if (mx >= btnX && mx <= btnX + btnW && my >= 432 && my <= 432 + btnH) {
          this.state = GAME_STATES.SETTINGS;
          audio.playClick();
          return;
        }

        // Button 3: QUIT (y = 514)
        if (mx >= btnX && mx <= btnX + btnW && my >= 514 && my <= 514 + btnH) {
          this.state = GAME_STATES.QUIT_CONFIRM;
          audio.playClick();
          return;
        }
      }
    }

        CONFIG.VIRTUAL_WIDTH / 2, CONFIG.VIRTUAL_HEIGHT / 2, 900

      sirenGrad.addColorStop(0, 'rgba(0, 0, 0, 0)');

      ctx.fillRect(0, 0, CONFIG.VIRTUAL_WIDTH, CONFIG.VIRTUAL_HEIGHT);

      // Floor grid lines
      ctx.strokeStyle = 'rgba(30, 41, 59, 0.45)';
      ctx.lineWidth = 1;
      for (let x = 0; x < CONFIG.VIRTUAL_WIDTH; x += 80) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, CONFIG.VIRTUAL_HEIGHT);
        ctx.stroke();
      }

        ctx.moveTo(0, y);
        ctx.lineTo(CONFIG.VIRTUAL_WIDTH, y);

      // Floating ambient ember particles
      for (let i = 0; i < this.homeEmberParticles.length; i++) {

        ctx.save();
        ctx.globalAlpha = p.alpha;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      // Great Bloody "OUTPOST ZERO" Title Header

      // 3 Main Action Buttons

        ctx.save();
        if (btn.primary) {
          // Crimson / Red Combat Gradient
          const bgGrad = ctx.createLinearGradient(btnX, btn.y, btnX + btnW, btn.y + btnH);
          bgGrad.addColorStop(0, isHovered ? '#b91c1c' : '#991b1b');
          bgGrad.addColorStop(1, isHovered ? '#7f1d1d' : '#450a0a');
          ctx.fillStyle = bgGrad;

          ctx.beginPath();
          ctx.roundRect(btnX, btn.y, btnW, btnH, 8);

        ctx.fillText(btn.icon, btnX + 36, btn.y + 42);

        if (!IS_TOUCH) {

          ctx.beginPath();
          ctx.roundRect(btnX + btnW - 115, btn.y + 19, 100, 28, 4);

          ctx.textAlign = 'center';

          ctx.fillText(btn.badge, btnX + btnW - 65, btn.y + 37);

        ctx.restore();

      // Tactical Session Dossier Card (Active Browser Session Storage)
      const dosW = 760;
      const dosH = 74;
      const dosX = (CONFIG.VIRTUAL_WIDTH - dosW) / 2;

      ctx.save();

      ctx.beginPath();
      ctx.roundRect(dosX, dosY, dosW, dosH, 8);
      ctx.fill();
      ctx.strokeStyle = '#1e293b';
      ctx.lineWidth = 1.5;
      ctx.stroke();

      // Top Header inside card
      ctx.textAlign = 'left';
      ctx.fillStyle = '#38bdf8';
      ctx.font = 'bold 11px sans-serif';
      ctx.fillText('YOUR STATS THIS SESSION', dosX + 20, dosY + 22);

      ctx.fillStyle = '#64748b';
      ctx.font = '10px sans-serif';
      ctx.textAlign = 'right';
      ctx.fillText('Resets when you close this tab', dosX + dosW - 20, dosY + 22);

      // Dossier Metrics row
      const stats = [
        { label: 'BEST SCORE', val: `${sessionDashboard.sessionData.highScore.toLocaleString()} PTS`, color: '#f59e0b' },
        { label: 'BEST ROUND', val: `ROUND ${sessionDashboard.sessionData.highestRound}`, color: '#ef4444' },
        { label: 'ZOMBIES KILLED', val: `${sessionDashboard.sessionData.totalKills}`, color: '#e2e8f0' },
        { label: 'ACCURACY', val: `${sessionDashboard.getAccuracy()}%`, color: '#22c55e' }
      ];

      const colW = (dosW - 40) / stats.length;
      for (let s = 0; s < stats.length; s++) {
        const sx = dosX + 20 + s * colW;
        ctx.textAlign = 'left';
        ctx.fillStyle = '#64748b';
        ctx.font = 'bold 10px sans-serif';
        ctx.fillText(stats[s].label, sx, dosY + 45);

        ctx.fillStyle = stats[s].color;
        ctx.font = 'bold 17px monospace';
        ctx.fillText(stats[s].val, sx, dosY + 65);

      // Footer Quick Guide
      ctx.textAlign = 'center';
      ctx.fillStyle = '#94a3b8';
      ctx.font = 'bold 12px sans-serif';
      ctx.fillText('HOW TO PLAY', CONFIG.VIRTUAL_WIDTH / 2, CONFIG.VIRTUAL_HEIGHT - 70);
      ctx.fillStyle = '#64748b';
      ctx.font = '13px sans-serif';
      ctx.fillText('WASD / Arrows: Move  ·  Mouse: Aim  ·  Left Click: Shoot  ·  R: Reload  ·  1–4 / Q / E: Switch Weapon', CONFIG.VIRTUAL_WIDTH / 2, CONFIG.VIRTUAL_HEIGHT - 48);
      ctx.fillText('G: Grenade  ·  X: Mine  ·  B: Shop  ·  U: Upgrade Weapon  ·  F: Use Forge (Round 3+)  ·  TAB: Stats  ·  P / ESC: Pause', CONFIG.VIRTUAL_WIDTH / 2, CONFIG.VIRTUAL_HEIGHT - 28);
    }

    // =======================================================================
    // 2. SETTINGS CONFIGURATION MODAL
    // =======================================================================
    updateSettings() {
      if (this.input.wasPressed('Escape') || this.input.wasPressed('KeyS') || this.input.wasPressed('s')) {
        this.state = GAME_STATES.HOME;
        audio.playClick();
        return;
      }

      if (this.input.wasClicked()) {
        const mx = this.input.mouse.x;
        const my = this.input.mouse.y;

        // Close / Back button (Top Right of modal: x = 1440, y = 80)
        if (mx >= 1420 && mx <= 1470 && my >= 65 && my <= 110) {
          this.state = GAME_STATES.HOME;
          audio.playClick();
          return;
        }

        // Bottom Actions
        // Save & Return: x = 480, y = 770, w = 280, h = 48
        if (mx >= 480 && mx <= 760 && my >= 770 && my <= 818) {
          settingsManager.save();
          this.state = GAME_STATES.HOME;
          audio.playClick();
          return;
        }

        // Restore Defaults: x = 780, y = 770, w = 220, h = 48
        if (mx >= 780 && mx <= 1000 && my >= 770 && my <= 818) {
          settingsManager.resetDefaults();
          audio.playClick();
          return;
        }

        // Settings Rows (Left Column, x = 120, row spacing = 68)
        const rowStartY = 165;
        const rowH = 68;

        // Row 0: Master Volume [0%, 25%, 50%, 75%, 100%]
        const volLevels = [0.0, 0.25, 0.5, 0.75, 1.0];
        const vBtnW = 75;
        for (let v = 0; v < volLevels.length; v++) {
          const bx = 380 + v * (vBtnW + 10);
          const by = rowStartY + 10;
          if (mx >= bx && mx <= bx + vBtnW && my >= by && my <= by + 34) {
            settingsManager.setMasterVolume(volLevels[v]);
            audio.playClick();
          }
        }

        // Row 1: SFX Toggle [ENABLED, MUTED]
        if (mx >= 380 && mx <= 500 && my >= rowStartY + rowH + 10 && my <= rowStartY + rowH + 44) {
          settingsManager.toggleSFX();
          audio.playClick();
        }

        // Row 2: Screen Shake [FULL, REDUCED, OFF]
        const shakes = [
          { val: 1.0, label: 'FULL 100%' },
          { val: 0.5, label: '50%' },
          { val: 0.0, label: 'OFF' }
        ];
        for (let s = 0; s < shakes.length; s++) {
          const bx = 380 + s * 115;
          const by = rowStartY + rowH * 2 + 10;
          if (mx >= bx && mx <= bx + 105 && my >= by && my <= by + 34) {
            settingsManager.setScreenShake(shakes[s].val);
            audio.playClick();
          }
        }

        // Row 3: Laser Sight Cycle [CYAN, EMERALD, CRIMSON, AMBER, OFF]
        if (mx >= 380 && mx <= 580 && my >= rowStartY + rowH * 3 + 10 && my <= rowStartY + rowH * 3 + 44) {
          settingsManager.cycleLaser();
          audio.playClick();
        }

        // Row 4: Blood & Gore [EXTREME, STANDARD, MINIMAL]
        if (mx >= 380 && mx <= 580 && my >= rowStartY + rowH * 4 + 10 && my <= rowStartY + rowH * 4 + 44) {
          settingsManager.cycleGore();
          audio.playClick();
        }

        // Row 5: Crosshair Style [TACTICAL, PRECISION DOT, CIRCLE]
        if (mx >= 380 && mx <= 580 && my >= rowStartY + rowH * 5 + 10 && my <= rowStartY + rowH * 5 + 44) {
          settingsManager.cycleCrosshair();
          audio.playClick();
        }

        // Row 6: Floating Damage Numbers [ON / OFF]
        if (mx >= 380 && mx <= 500 && my >= rowStartY + rowH * 6 + 10 && my <= rowStartY + rowH * 6 + 44) {
          settingsManager.toggleFloatingDamage();
          audio.playClick();
        }

        // Row 7: Auto-Reload on Empty [ENABLED / MANUAL]
        if (mx >= 380 && mx <= 580 && my >= rowStartY + rowH * 7 + 10 && my <= rowStartY + rowH * 7 + 44) {
          settingsManager.toggleAutoReload();
          audio.playClick();
        }
      }
    }

        {
          label: 'AUTO-RELOAD',
          desc: 'Reload when magazine is empty',
          render: (y) => {
            const ar = settingsManager.data.autoReload;
            ctx.fillStyle = ar ? '#0284c7' : '#334155';
            ctx.beginPath();
            ctx.roundRect(380, y + 10, 200, 34, 6);
            ctx.fill();
            ctx.strokeStyle = ar ? '#38bdf8' : '#64748b';
            ctx.stroke();

            ctx.textAlign = 'center';
            ctx.fillStyle = ar ? '#ffffff' : '#94a3b8';
            ctx.font = 'bold 12px sans-serif';
            ctx.fillText(ar ? '✔ AUTO-RELOAD ON' : 'MANUAL [R] ONLY', 480, y + 32);
          }
        }
      ];

      for (let i = 0; i < rows.length; i++) {
        const ry = rowStartY + i * rowH;

        ctx.fillStyle = 'rgba(15, 23, 42, 0.6)';
        ctx.beginPath();
        ctx.roundRect(rowX, ry, rowW, rowH - 8, 6);
        ctx.fill();
        ctx.strokeStyle = '#1e293b';
        ctx.lineWidth = 1;
        ctx.stroke();

        ctx.textAlign = 'left';
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 13px sans-serif';
        ctx.fillText(rows[i].label, rowX + 16, ry + 25);

        ctx.fillStyle = '#64748b';
        ctx.font = '11px sans-serif';
        ctx.fillText(rows[i].desc, rowX + 16, ry + 44);

        rows[i].render(ry);
      }

      // Settings Right Column (Live Tactical Calibration Preview)
      const prevX = modalX + 800;
      const prevY = modalY + 85;
      const prevW = 580;
      const prevH = 615;

      ctx.fillStyle = '#060a12';
      ctx.beginPath();
      ctx.roundRect(prevX, prevY, prevW, prevH, 8);
      ctx.fill();
      ctx.strokeStyle = '#1e293b';
      ctx.lineWidth = 1.5;
      ctx.stroke();

      ctx.textAlign = 'left';
      ctx.fillStyle = '#38bdf8';
      ctx.font = 'bold 13px sans-serif';
      ctx.fillText('PREVIEW', prevX + 20, prevY + 28);

      // Live mini render area
      const miniAreaX = prevX + 20;
      const miniAreaY = prevY + 45;
      const miniAreaW = prevW - 40;
      const miniAreaH = 220;

      ctx.fillStyle = '#090d16';
      ctx.fillRect(miniAreaX, miniAreaY, miniAreaW, miniAreaH);
      ctx.strokeStyle = '#151d2f';
      ctx.strokeRect(miniAreaX, miniAreaY, miniAreaW, miniAreaH);

      // Mini Operative in preview
      ctx.save();
      const opX = miniAreaX + 90;
      const opY = miniAreaY + 110;

      // Operative aiming towards right
      ctx.fillStyle = '#1e293b';
      ctx.beginPath();
      ctx.arc(opX, opY, 18, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#0f172a';
      ctx.lineWidth = 2.5;
      ctx.stroke();

      // Laser Beam from operative
      if (settingsManager.data.laserColor !== 'off') {
        ctx.strokeStyle = settingsManager.data.laserColor;
        ctx.lineWidth = 1;
        ctx.setLineDash([6, 6]);
        ctx.beginPath();
        ctx.moveTo(opX + 18, opY);
        ctx.lineTo(opX + 260, opY);
        ctx.stroke();
        ctx.setLineDash([]);
      }

      // Weapon barrel
      ctx.fillStyle = '#64748b';
      ctx.fillRect(opX + 10, opY - 3.5, 24, 7);

      // Visor
      ctx.fillStyle = settingsManager.data.laserColor !== 'off' ? settingsManager.data.laserColor : '#38bdf8';
      ctx.beginPath();
      ctx.arc(opX + 6, opY, 6, -Math.PI / 2.5, Math.PI / 2.5);
      ctx.fill();

      // Dummy Target Mutant
      const tgtX = opX + 260;
      const tgtY = opY;
      ctx.fillStyle = '#450a0a';
      ctx.beginPath();
      ctx.arc(tgtX, tgtY, 20, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#7f1d1d';
      ctx.lineWidth = 2;
      ctx.stroke();

      // Crosshair on target
      const rColor = settingsManager.data.laserColor !== 'off' ? settingsManager.data.laserColor : '#38bdf8';
      ctx.strokeStyle = rColor;
      ctx.fillStyle = rColor;
      ctx.lineWidth = 1.5;

      if (settingsManager.data.crosshairStyle === 'dot') {
        ctx.beginPath();
        ctx.arc(tgtX, tgtY, 3.5, 0, Math.PI * 2);
        ctx.fill();
      } else if (settingsManager.data.crosshairStyle === 'circle') {
        ctx.beginPath();
        ctx.arc(tgtX, tgtY, 8, 0, Math.PI * 2);
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(tgtX, tgtY, 2, 0, Math.PI * 2);
        ctx.fill();
      } else {
        ctx.beginPath();
        ctx.arc(tgtX, tgtY, 2, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(tgtX, tgtY - 5);
        ctx.lineTo(tgtX, tgtY - 14);
        ctx.moveTo(tgtX, tgtY + 5);
        ctx.lineTo(tgtX, tgtY + 14);
        ctx.moveTo(tgtX - 5, tgtY);
        ctx.lineTo(tgtX - 14, tgtY);
        ctx.moveTo(tgtX + 5, tgtY);
        ctx.lineTo(tgtX + 14, tgtY);
        ctx.stroke();
      }

      // Sample floating damage number
      if (settingsManager.data.floatingDamage) {
        ctx.fillStyle = '#facc15';
        ctx.font = 'bold 15px monospace';
        ctx.textAlign = 'center';
        ctx.fillText('+160 CRIT!', tgtX, tgtY - 30);
      }
      ctx.restore();

      // Control Bindings Reference Table
      const tblY = miniAreaY + miniAreaH + 20;
      ctx.textAlign = 'left';
      ctx.fillStyle = '#cbd5e1';
      ctx.font = 'bold 12px sans-serif';
      ctx.fillText('CONTROLS', prevX + 20, tblY);

      const bindings = [
        { k: 'WASD / ARROWS', d: 'Move' },
        { k: 'MOUSE', d: 'Aim' },
        { k: 'LEFT CLICK', d: 'Shoot' },
        { k: 'R', d: 'Reload' },
        { k: '1, 2, 3, 4', d: 'Switch to weapon 1–4' },
        { k: 'Q / E / WHEEL', d: 'Previous / next weapon' },
        { k: 'U', d: 'Upgrade current weapon (costs points)' },
        { k: 'B', d: 'Open the shop' },
        { k: 'F', d: 'Use the Cyber-Forge (from round 3)' },
        { k: 'G / X', d: 'Throw grenade / place mine' },
        { k: 'TAB', d: 'Show your stats' },
        { k: 'P / ESC', d: 'Pause' }
      ];

      for (let b = 0; b < bindings.length; b++) {
        const by = tblY + 22 + b * 26;
        ctx.fillStyle = '#1e293b';
        ctx.beginPath();
        ctx.roundRect(prevX + 20, by - 12, 120, 20, 4);
        ctx.fill();

        ctx.textAlign = 'center';
        ctx.fillStyle = '#38bdf8';
        ctx.font = 'bold 10px monospace';
        ctx.fillText(bindings[b].k, prevX + 80, by + 2);

        ctx.textAlign = 'left';
        ctx.fillStyle = '#94a3b8';
        ctx.font = '11px sans-serif';
        ctx.fillText(bindings[b].d, prevX + 155, by + 2);
      }

      // Bottom Action Buttons
      const saveBtnW = 280;
      const saveBtnH = 48;
      const saveBtnX = modalX + modalW / 2 - 270;
      const saveBtnY = modalY + modalH - 68;

      ctx.fillStyle = '#22c55e';
      ctx.beginPath();
      ctx.roundRect(saveBtnX, saveBtnY, saveBtnW, saveBtnH, 8);
      ctx.fill();
      ctx.strokeStyle = '#4ade80';
      ctx.stroke();

      ctx.textAlign = 'center';
      ctx.fillStyle = '#052e16';
      ctx.font = '900 16px sans-serif';
      ctx.fillText('SAVE & GO BACK', saveBtnX + saveBtnW / 2, saveBtnY + 30);

      const defBtnW = 220;
      const defBtnX = modalX + modalW / 2 + 40;
      ctx.fillStyle = '#334155';
      ctx.beginPath();
      ctx.roundRect(defBtnX, saveBtnY, defBtnW, saveBtnH, 8);
      ctx.fill();
      ctx.strokeStyle = '#475569';
      ctx.stroke();

      ctx.fillStyle = '#e2e8f0';
      ctx.font = 'bold 14px sans-serif';
      ctx.fillText('RESTORE DEFAULTS', defBtnX + defBtnW / 2, saveBtnY + 30);

      ctx.restore();
    }

    // =======================================================================
    // 3. QUIT CONFIRMATION & TERMINAL SHUTDOWN
    // =======================================================================
    updateQuitConfirm() {
      if (this.input.wasPressed('Escape')) {
        this.state = GAME_STATES.HOME;
        audio.playClick();
        return;
      }

      if (this.input.wasClicked()) {
        const mx = this.input.mouse.x;
        const my = this.input.mouse.y;

        const boxW = 600;
        const boxH = 340;
        const boxX = (CONFIG.VIRTUAL_WIDTH - boxW) / 2;
        const boxY = (CONFIG.VIRTUAL_HEIGHT - boxH) / 2;

        // Confirm Stand Down Button (x = boxX + 40, y = boxY + 240, w = 240, h = 50)
        if (mx >= boxX + 40 && mx <= boxX + 280 && my >= boxY + 240 && my <= boxY + 290) {
          audio.playClick();
          try {
            window.close();
          } catch (e) {
            console.log('window.close() restricted by browser:', e);
          }
          this.state = GAME_STATES.TERMINAL_SHUTDOWN;
          return;
        }

        // Cancel Button (x = boxX + 320, y = boxY + 240, w = 240, h = 50)
        if (mx >= boxX + 320 && mx <= boxX + 560 && my >= boxY + 240 && my <= boxY + 290) {
          this.state = GAME_STATES.HOME;
          audio.playClick();
          return;
        }
      }
    }

    drawQuitConfirm(ctx) {
      ctx.fillStyle = 'rgba(5, 7, 10, 0.88)';
      ctx.fillRect(0, 0, CONFIG.VIRTUAL_WIDTH, CONFIG.VIRTUAL_HEIGHT);

      const boxW = 600;
      const boxH = 340;
      const boxX = (CONFIG.VIRTUAL_WIDTH - boxW) / 2;
      const boxY = (CONFIG.VIRTUAL_HEIGHT - boxH) / 2;

      ctx.save();
      ctx.fillStyle = '#0f172a';
      ctx.beginPath();
      ctx.roundRect(boxX, boxY, boxW, boxH, 10);
      ctx.fill();
      ctx.strokeStyle = '#ef4444';
      ctx.lineWidth = 2;
      ctx.stroke();

      // Warning Header
      ctx.fillStyle = '#991b1b';
      ctx.beginPath();
      ctx.roundRect(boxX, boxY, boxW, 55, [10, 10, 0, 0]);
      ctx.fill();

      ctx.textAlign = 'center';
      ctx.fillStyle = '#ffffff';
      ctx.font = '900 20px sans-serif';
      ctx.fillText('⚠  QUIT GAME?', CONFIG.VIRTUAL_WIDTH / 2, boxY + 36);

      // Warning Body Text
      ctx.fillStyle = '#f8fafc';
      ctx.font = 'bold 16px sans-serif';
      ctx.fillText('Are you sure you want to quit Outpost Zero?', CONFIG.VIRTUAL_WIDTH / 2, boxY + 105);

      ctx.fillStyle = '#94a3b8';
      ctx.font = '13px sans-serif';
      wrapText(
        ctx,
        'Your stats are kept until you close this browser tab. Press ESC to go back.',
        CONFIG.VIRTUAL_WIDTH / 2,
        boxY + 140,
        boxW - 80,
        22
      );

      // Button 1: Confirm Stand Down
      ctx.fillStyle = '#dc2626';
      ctx.beginPath();
      ctx.roundRect(boxX + 40, boxY + 240, 240, 50, 6);
      ctx.fill();
      ctx.strokeStyle = '#f87171';
      ctx.stroke();

      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 15px sans-serif';
      ctx.fillText('YES, QUIT', boxX + 160, boxY + 271);

      // Button 2: Cancel
      ctx.fillStyle = '#334155';
      ctx.beginPath();
      ctx.roundRect(boxX + 320, boxY + 240, 240, 50, 6);
      ctx.fill();
      ctx.strokeStyle = '#64748b';
      ctx.stroke();

      ctx.fillStyle = '#e2e8f0';
      ctx.font = 'bold 15px sans-serif';
      ctx.fillText('CANCEL', boxX + 440, boxY + 271);

      ctx.restore();
    }

    updateTerminalShutdown() {
      if (this.input.wasClicked()) {
        const mx = this.input.mouse.x;
        const my = this.input.mouse.y;

        // Reconnect / Return Button
        if (mx >= CONFIG.VIRTUAL_WIDTH / 2 - 160 && mx <= CONFIG.VIRTUAL_WIDTH / 2 + 160 &&
            my >= 610 && my <= 665) {
          this.state = GAME_STATES.HOME;
          audio.playClick();
        }
      }
    }

    drawTerminalShutdown(ctx) {
      // CRT Terminal Phosphor Green & Amber
      ctx.fillStyle = '#020502';
      ctx.fillRect(0, 0, CONFIG.VIRTUAL_WIDTH, CONFIG.VIRTUAL_HEIGHT);

      // CRT Scanlines
      ctx.fillStyle = 'rgba(16, 185, 129, 0.04)';

        ctx.fillRect(0, y, CONFIG.VIRTUAL_WIDTH, 2);
      }

      ctx.save();
      ctx.textAlign = 'center';
      ctx.fillStyle = '#22c55e';
      ctx.font = 'bold 36px monospace';
      ctx.fillText('// OPERATIVE STAND-DOWN EXECUTED //', CONFIG.VIRTUAL_WIDTH / 2, 280);

      ctx.fillStyle = '#86efac';
      ctx.font = '18px monospace';
      ctx.fillText('> OUTPOST ZERO TACTICAL DEFENSE LINK: TERMINATED', CONFIG.VIRTUAL_WIDTH / 2, 340);
      ctx.fillText('> COMBAT TELEMETRY PRESERVED IN BROWSER STORAGE', CONFIG.VIRTUAL_WIDTH / 2, 375);
      ctx.fillText('> STATUS: TERMINAL DORMANT // ALL SECTORS QUARANTINED', CONFIG.VIRTUAL_WIDTH / 2, 410);

      ctx.fillStyle = '#64748b';
      ctx.font = '15px sans-serif';

      // Re-engage Button
      const bW = 320;
      const bH = 55;
      ctx.fillStyle = '#15803d';
      ctx.beginPath();
      ctx.roundRect(CONFIG.VIRTUAL_WIDTH / 2 - bW / 2, 610, bW, bH, 6);
      ctx.fill();
      ctx.strokeStyle = '#4ade80';
      ctx.lineWidth = 1.5;
      ctx.stroke();

      ctx.fillStyle = '#ffffff';
      ctx.font = '900 16px monospace';
      ctx.fillText('⟳ RE-ENGAGE MISSION / BASE', CONFIG.VIRTUAL_WIDTH / 2, 644);
