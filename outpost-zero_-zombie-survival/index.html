  // =========================================================================
  // 2. SESSION STORAGE DASHBOARD MANAGER
  // "as long as the person is playing the score is being saved, if he leaves the game resets"
  // =========================================================================
  class SessionDashboardManager {
    constructor() {
      this.STORAGE_KEY = 'outpost_zero_live_session';
      this.sessionData = this.loadSession();
    }

    loadSession() {
      try {
        const stored = sessionStorage.getItem(this.STORAGE_KEY);
        if (stored) {
          return JSON.parse(stored);
        }
      } catch (e) {
        console.warn('SessionStorage unavailable, using memory fallback:', e);
      }
      return this.createFreshSession();
    }

    createFreshSession() {
      const fresh = {
        sessionStartTime: Date.now(),
        totalSessionScore: 0,
        highScore: 0,
        gamesPlayed: 0,
        highestRound: 1,
        totalKills: 0,
        totalWalkersKilled: 0,
        totalRunnersKilled: 0,
        totalBrutesKilled: 0,
        totalSpittersKilled: 0,
        totalShotsFired: 0,
        totalShotsHit: 0,
        totalDamageDealt: 0,
        cyberForgeOverclocksPerformed: 0,
        itemsPurchased: 0
      };
      this.save(fresh);
      return fresh;
    }

    save(data) {
      if (data) this.sessionData = data;
      try {
        sessionStorage.setItem(this.STORAGE_KEY, JSON.stringify(this.sessionData));
      } catch (e) {
        // Ignore quota/disabled storage defensively
      }
    }

    recordGameStart() {
      this.sessionData.gamesPlayed++;
      this.save();
    }

    recordKill(typeKey) {
      this.sessionData.totalKills++;
      if (typeKey === 'walker') this.sessionData.totalWalkersKilled++;
      else if (typeKey === 'runner') this.sessionData.totalRunnersKilled++;
      else if (typeKey === 'brute') this.sessionData.totalBrutesKilled++;
      else if (typeKey === 'spitter') this.sessionData.totalSpittersKilled++;
      this.save();
    }

    recordDamage(amount) {
      this.sessionData.totalDamageDealt += Math.round(amount);
    }

    recordShot(hit = false) {
      this.sessionData.totalShotsFired++;
      if (hit) this.sessionData.totalShotsHit++;
    }

    recordScore(score, round) {
      this.sessionData.totalSessionScore = Math.max(this.sessionData.totalSessionScore, score);
      this.sessionData.highScore = Math.max(this.sessionData.highScore, score);
      this.sessionData.highestRound = Math.max(this.sessionData.highestRound, round);
      this.save();
    }

    reset() {
      this.sessionData = this.createFreshSession();
    }

    getAccuracy() {
      if (this.sessionData.totalShotsFired === 0) return 0;
      return Math.round((this.sessionData.totalShotsHit / this.sessionData.totalShotsFired) * 100);
    }

    getSessionDurationSeconds() {
      return Math.floor((Date.now() - this.sessionData.sessionStartTime) / 1000);
    }
  }

  // =========================================================================
  // 3. SYNTHESIZED WEB AUDIO API SOUND ENGINE
  // =========================================================================
  class SoundEngine {
    constructor() {
      this.ctx = null;
      this.masterGainNode = null;
      this.volume = 0.8;
      this.muted = false;
      this.initialized = false;
    }

    init() {
      if (this.initialized) return;
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (AudioCtx) {
          this.ctx = new AudioCtx();
          this.masterGainNode = this.ctx.createGain();
          this.masterGainNode.gain.setValueAtTime(this.muted ? 0 : this.volume, this.ctx.currentTime);
          this.masterGainNode.connect(this.ctx.destination);
          this.initialized = true;
        }
      } catch (e) {
        console.warn('Web Audio API not supported:', e);
      }
    }

    get destinationNode() {
      return (this.masterGainNode && this.ctx) ? this.masterGainNode : (this.ctx ? this.ctx.destination : null);
    }

    setVolume(vol) {
      this.volume = Math.max(0, Math.min(1, vol));
      if (this.masterGainNode && this.ctx) {
        this.masterGainNode.gain.setValueAtTime(this.muted ? 0 : this.volume, this.ctx.currentTime);
      }
    }

    resume() {
      if (this.ctx && this.ctx.state === 'suspended') {
        this.ctx.resume();
      }
    }

    toggleMute() {
      this.muted = !this.muted;
      if (this.masterGainNode && this.ctx) {
        this.masterGainNode.gain.setValueAtTime(this.muted ? 0 : this.volume, this.ctx.currentTime);
      }
      return this.muted;
    }

    playClick() {
      if (this.muted || !this.ctx) return;
      this.resume();
      const now = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(680, now);
      osc.frequency.exponentialRampToValueAtTime(320, now + 0.05);
      gain.gain.setValueAtTime(0.2, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
      osc.connect(gain);
      gain.connect(this.destinationNode);
      osc.start(now);
      osc.stop(now + 0.07);
    }

    playHover() {
      if (this.muted || !this.ctx) return;
      this.resume();
      const now = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(440, now);
      gain.gain.setValueAtTime(0.06, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.03);
      osc.connect(gain);
      gain.connect(this.destinationNode);
      osc.start(now);
      osc.stop(now + 0.04);
    }

    playShoot(weaponId, tierIndex, overclockId = null) {
      if (this.muted || !this.ctx) return;
      this.resume();
      const now = this.ctx.currentTime;

      // Overclocked sound variant
      if (overclockId === 'plasma') {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(540, now);
        osc.frequency.exponentialRampToValueAtTime(120, now + 0.14);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
        osc.connect(gain);
        gain.connect(this.destinationNode);
        osc.start(now);
        osc.stop(now + 0.16);
        return;
      }

      if (overclockId === 'tesla') {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(750, now);
        osc.frequency.exponentialRampToValueAtTime(220, now + 0.1);
        gain.gain.setValueAtTime(0.25, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.11);
        osc.connect(gain);
        gain.connect(this.destinationNode);
        osc.start(now);
        osc.stop(now + 0.12);
        return;
      }

      if (weaponId === 'shotgun') {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(140, now);
        osc.frequency.exponentialRampToValueAtTime(30, now + 0.22);
        gain.gain.setValueAtTime(0.45, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
        osc.connect(gain);
        gain.connect(this.destinationNode);
        osc.start(now);
        osc.stop(now + 0.26);
        this.playNoise(now, 0.18, 0.35, 1200);
      } else if (weaponId === 'lmg') {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(160 + tierIndex * 15, now);
        osc.frequency.exponentialRampToValueAtTime(45, now + 0.12);
        gain.gain.setValueAtTime(0.35, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.14);
        osc.connect(gain);
        gain.connect(this.destinationNode);
        osc.start(now);
        osc.stop(now + 0.15);
        this.playNoise(now, 0.08, 0.25, 2400);
      } else if (weaponId === 'smg') {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(280 + tierIndex * 25, now);
        osc.frequency.exponentialRampToValueAtTime(80, now + 0.06);
        gain.gain.setValueAtTime(0.22, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.07);
        osc.connect(gain);
        gain.connect(this.destinationNode);
        osc.start(now);
        osc.stop(now + 0.08);
        this.playNoise(now, 0.04, 0.18, 3800);
      } else {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(240 + tierIndex * 30, now);
        osc.frequency.exponentialRampToValueAtTime(60, now + 0.09);
        gain.gain.setValueAtTime(0.28, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.11);
        osc.connect(gain);
        gain.connect(this.destinationNode);
        osc.start(now);
        osc.stop(now + 0.12);
        this.playNoise(now, 0.06, 0.22, 3200);
      }
    }

    playNoise(startTime, duration, volume, filterFreq) {
      if (!this.ctx) return;
      const bufferSize = Math.floor(this.ctx.sampleRate * duration);
      const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        data[i] = Math.random() * 2 - 1;
      }
      const noise = this.ctx.createBufferSource();
      noise.buffer = buffer;

      const filter = this.ctx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(filterFreq || 2000, startTime);

      const gain = this.ctx.createGain();
      gain.gain.setValueAtTime(volume, startTime);
      gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);

      noise.connect(filter);
      filter.connect(gain);
      gain.connect(this.destinationNode);

      noise.start(startTime);
      noise.stop(startTime + duration);
    }

      if (this.muted || !this.ctx) return;

    bloodGore: 'extreme',      // 'extreme', 'standard', 'minimal'
    floatingDamage: true,
    crosshairStyle: 'tactical', // 'tactical', 'dot', 'circle'
    autoReload: true
  };

  class SettingsManager {
    constructor() {
      this.data = this.load();
      if (this.data.masterVolume !== undefined) {
        audio.setVolume(this.data.masterVolume);
      }
      if (!this.data.sfxEnabled) {
        audio.muted = true;
      }
    }

    load() {
      try {
        const stored = localStorage.getItem(SETTINGS_STORAGE_KEY);
        if (stored) {
          return Object.assign({}, DEFAULT_SETTINGS, JSON.parse(stored));
        }
      } catch (e) {
        console.warn('Storage unavailable for settings:', e);
      }
      return Object.assign({}, DEFAULT_SETTINGS);
    }

    save() {
      try {
        localStorage.setItem(SETTINGS_STORAGE_KEY, JSON.stringify(this.data));
      } catch (e) {
        console.warn('Failed to save settings:', e);
      }
    }

    setMasterVolume(vol) {
      this.data.masterVolume = vol;
      audio.setVolume(vol);
      this.save();
    }

    toggleSFX() {
      this.data.sfxEnabled = !this.data.sfxEnabled;
      audio.muted = !this.data.sfxEnabled;
      this.save();
    }

    setScreenShake(val) {
      this.data.screenShake = val;
      this.save();
    }

    cycleLaser() {
      const options = [
        { color: '#38bdf8', name: 'CYAN' },
        { color: '#22c55e', name: 'EMERALD' },
        { color: '#ef4444', name: 'CRIMSON' },
        { color: '#f59e0b', name: 'AMBER' },
        { color: 'off', name: 'OFF' }
      ];
      let idx = options.findIndex(o => o.color === this.data.laserColor);
      idx = (idx + 1) % options.length;
      this.data.laserColor = options[idx].color;
      this.data.laserName = options[idx].name;
      this.save();
    }

    cycleGore() {
      const options = ['extreme', 'standard', 'minimal'];
      let idx = options.indexOf(this.data.bloodGore);
      idx = (idx + 1) % options.length;
      this.data.bloodGore = options[idx];
      this.save();
    }

    cycleCrosshair() {
      const options = ['tactical', 'dot', 'circle'];
      let idx = options.indexOf(this.data.crosshairStyle);
      idx = (idx + 1) % options.length;
      this.data.crosshairStyle = options[idx];
      this.save();
    }

    toggleFloatingDamage() {
      this.data.floatingDamage = !this.data.floatingDamage;
      this.save();
    }

    toggleAutoReload() {
      this.data.autoReload = !this.data.autoReload;
      this.save();
    }

    resetDefaults() {
      this.data = Object.assign({}, DEFAULT_SETTINGS);
      audio.setVolume(this.data.masterVolume);
      audio.muted = !this.data.sfxEnabled;
      this.save();
    }
  }

  const settingsManager = new SettingsManager();
  class InputManager {
    constructor(canvas) {
      this.canvas = canvas;
      this.keys = {};
      this.pressed = {};
      this.isTouch = IS_TOUCH;
      // Virtual thumbsticks (virtual canvas coordinates)
      this.moveStick = { id: null, ox: 0, oy: 0, x: 0, y: 0, dx: 0, dy: 0 };
      this.aimStick = { id: null, ox: 0, oy: 0, x: 0, y: 0, angle: 0, active: false };
      this.touchFiring = false;
      this.mouse = {
        x: CONFIG.VIRTUAL_WIDTH / 2,
        y: CONFIG.VIRTUAL_HEIGHT / 2,
        down: false,
        clicked: false
      };

      this.setupListeners();
    }

    setupListeners() {
      window.addEventListener('keydown', (e) => {
        audio.init();

        const k = e.key.toLowerCase();
        const code = e.code ? e.code.toLowerCase() : '';

        if (!e.repeat) {
          this.pressed[k] = true;
          this.pressed[e.key] = true;
          this.pressed[e.code] = true;
          this.pressed[code] = true;
        }

        this.keys[k] = true;
        this.keys[e.key] = true;
        this.keys[e.code] = true;
        this.keys[code] = true;

        // Prevent Tab focus default
        if (k === 'tab' || code === 'tab') {
          e.preventDefault();
          if (window.game) window.game.toggleDashboard();
        }

        // B: Armory Shop toggle
        if (k === 'b' || code === 'keyb') {
          if (window.game) window.game.toggleShop();
        }

        // F: Interact with Cyber-Forge
        if (k === 'f' || code === 'keyf') {
          if (window.game && window.game.state === 'PLAYING') {
            window.game.tryInteractCyberForge();
          }
        }

        // G: Frag Grenade throw
        if (k === 'g' || code === 'keyg') {
          if (window.game && window.game.state === 'PLAYING' && window.game.player) {
            window.game.player.throwGrenade(window.game.grenades);
          }
        }

        // X: Claymore Mine deployment
        if (k === 'x' || code === 'keyx') {
          if (window.game && window.game.state === 'PLAYING' && window.game.player) {
            window.game.player.plantMine(window.game.mines);
          }
        }

        // R: Reloading
        if ((k === 'r' || code === 'keyr') && window.game && window.game.player && window.game.state === 'PLAYING') {
          window.game.player.startReload();
        }

        // 1-4, Q, E: Weapon hot-swapping
        if (window.game && window.game.player && window.game.state === 'PLAYING') {
          if (k === '1' || code === 'digit1') window.game.player.switchWeapon('lmg');
          if (k === '2' || code === 'digit2') window.game.player.switchWeapon('smg');
          if (k === '3' || code === 'digit3') window.game.player.switchWeapon('shotgun');
          if (k === '4' || code === 'digit4') window.game.player.switchWeapon('pistols');
          if (k === 'q' || code === 'keyq') window.game.player.cycleWeapon(-1);
          if (k === 'e' || code === 'keye') window.game.player.cycleWeapon(1);
        }
      });

      window.addEventListener('keyup', (e) => {
        const k = e.key.toLowerCase();
        const code = e.code ? e.code.toLowerCase() : '';
        this.keys[k] = false;
        this.keys[e.key] = false;
        this.keys[e.code] = false;
        this.keys[code] = false;
      });

      window.addEventListener('wheel', (e) => {
        if (window.game && window.game.player && window.game.state === 'PLAYING') {
          if (e.deltaY > 0) window.game.player.cycleWeapon(1);
          else if (e.deltaY < 0) window.game.player.cycleWeapon(-1);
        }
      }, { passive: true });

      window.addEventListener('mousemove', (e) => {
        const rect = this.canvas.getBoundingClientRect();
        this.mouse.x = (e.clientX - rect.left) * (CONFIG.VIRTUAL_WIDTH / rect.width);
        this.mouse.y = (e.clientY - rect.top) * (CONFIG.VIRTUAL_HEIGHT / rect.height);
      });

      window.addEventListener('mousedown', (e) => {
        audio.init();
        if (e.button === 0) {
          this.mouse.down = true;
          this.mouse.clicked = true;
        }
      });

      window.addEventListener('mouseup', (e) => {
        if (e.button === 0) {
          this.mouse.down = false;
        }
      });

      this.canvas.addEventListener('contextmenu', (e) => e.preventDefault());

      this.setupTouchListeners();
    }

    toVirtual(touch) {
      const rect = this.canvas.getBoundingClientRect();
      return {
        x: (touch.clientX - rect.left) * (CONFIG.VIRTUAL_WIDTH / rect.width),
        y: (touch.clientY - rect.top) * (CONFIG.VIRTUAL_HEIGHT / rect.height)
      };
    }

    setupTouchListeners() {
      const STICK_RADIUS = 110;

      const onStart = (e) => {
        e.preventDefault();
        audio.init();
        const game = window.game;
        if (game) game.requestMobileFullscreen();

        for (const t of e.changedTouches) {
          const p = this.toVirtual(t);

          if (game && game.state === 'PLAYING') {
            // On-screen buttons take priority
            if (game.handleTouchButton(p.x, p.y)) continue;

            if (p.x < CONFIG.VIRTUAL_WIDTH / 2) {
              if (this.moveStick.id === null) {
                Object.assign(this.moveStick, { id: t.identifier, ox: p.x, oy: p.y, x: p.x, y: p.y, dx: 0, dy: 0 });
              }
            } else if (this.aimStick.id === null) {
              Object.assign(this.aimStick, { id: t.identifier, ox: p.x, oy: p.y, x: p.x, y: p.y, active: false });
            }
          } else {
            // Menus & overlays: a tap behaves like a mouse click
            this.mouse.x = p.x;
            this.mouse.y = p.y;
            this.mouse.clicked = true;
          }
        }
      };

      const onMove = (e) => {
        e.preventDefault();
        for (const t of e.changedTouches) {
          const p = this.toVirtual(t);
          if (t.identifier === this.moveStick.id) {
            let dx = p.x - this.moveStick.ox;
            let dy = p.y - this.moveStick.oy;
            const len = Math.hypot(dx, dy);
            if (len > STICK_RADIUS) {
              dx = dx / len * STICK_RADIUS;
              dy = dy / len * STICK_RADIUS;
            }
            this.moveStick.x = this.moveStick.ox + dx;
            this.moveStick.y = this.moveStick.oy + dy;
            const mag = Math.min(1, len / STICK_RADIUS);
            const dead = len < 12;
            this.moveStick.dx = dead ? 0 : (dx / (Math.hypot(dx, dy) || 1)) * mag;
            this.moveStick.dy = dead ? 0 : (dy / (Math.hypot(dx, dy) || 1)) * mag;
          } else if (t.identifier === this.aimStick.id) {
            let dx = p.x - this.aimStick.ox;
            let dy = p.y - this.aimStick.oy;
            const len = Math.hypot(dx, dy);
            if (len > STICK_RADIUS) {
              dx = dx / len * STICK_RADIUS;
              dy = dy / len * STICK_RADIUS;
            }
            this.aimStick.x = this.aimStick.ox + dx;
            this.aimStick.y = this.aimStick.oy + dy;
            if (len > 18) {
              this.aimStick.angle = Math.atan2(dy, dx);
              this.aimStick.active = true;
            }
          }
        }
        this.touchFiring = this.aimStick.active;
      };

      const onEnd = (e) => {
        e.preventDefault();
        for (const t of e.changedTouches) {
          if (t.identifier === this.moveStick.id) {
            Object.assign(this.moveStick, { id: null, dx: 0, dy: 0 });
          } else if (t.identifier === this.aimStick.id) {
            Object.assign(this.aimStick, { id: null, active: false });
          }
        }
        this.touchFiring = this.aimStick.active;
      };

      this.canvas.addEventListener('touchstart', onStart, { passive: false });
      this.canvas.addEventListener('touchmove', onMove, { passive: false });
      this.canvas.addEventListener('touchend', onEnd, { passive: false });
      this.canvas.addEventListener('touchcancel', onEnd, { passive: false });
    }

    resetTouchSticks() {
      Object.assign(this.moveStick, { id: null, dx: 0, dy: 0 });
      Object.assign(this.aimStick, { id: null, active: false });
      this.touchFiring = false;
    }

    isDown(identifier) {
      if (!identifier) return false;
      const lower = identifier.toLowerCase();
      return !!(this.keys[lower] || this.keys[identifier]);
    }

    // True only on the frame a key was first pressed (not while held)
    wasPressed(identifier) {
      if (!identifier) return false;
      return !!(this.pressed[identifier.toLowerCase()] || this.pressed[identifier]);
    }

    endFrame() {
      this.pressed = {};
    }

    wasClicked() {
      const val = this.mouse.clicked;
      this.mouse.clicked = false;
      return val;
    }
  }

  // =========================================================================
  // 5. CYBER-FORGE UPGRADE MACHINE ENTITY
  // Appears after CONFIG.CYBER_FORGE_ROUND in the center of the arena
  // =========================================================================
  class CyberForgeMachine {
    constructor(x, y) {
      this.x = x;
      this.y = y;
      this.radius = 48;
      this.active = false;
      this.pulse = 0;
      this.ringAngle = 0;
      this.coreGlow = 0;
      this.smokeParticles = [];
    }

    activate() {
      if (!this.active) {
        this.active = true;
        audio.playCyberForgeActivate();
      }
    }

    update(dt) {
      if (!this.active) return;
      this.pulse += dt * 3.5;
      this.ringAngle += dt * 1.8;
      this.coreGlow = 0.5 + Math.sin(this.pulse) * 0.4;
    }

    draw(ctx, playerDist) {
      if (!this.active) return;

      ctx.save();
      ctx.translate(this.x, this.y);

      // Radial base ambient illumination
      const baseGrad = ctx.createRadialGradient(0, 0, 10, 0, 0, 110);
      baseGrad.addColorStop(0, 'rgba(6, 182, 212, 0.35)');
      baseGrad.addColorStop(0.6, 'rgba(14, 165, 233, 0.12)');
      baseGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = baseGrad;
      ctx.beginPath();
      ctx.arc(0, 0, 110, 0, Math.PI * 2);
      ctx.fill();

      // Cybernetic Foundation Plate
      ctx.fillStyle = '#0f172a';
      ctx.strokeStyle = '#334155';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(0, 0, this.radius + 6, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      // Rotating Outer Reactor Ring with cooling vents
      ctx.save();
      ctx.rotate(this.ringAngle);
      ctx.strokeStyle = '#0284c7';
      ctx.lineWidth = 3;
      ctx.setLineDash([14, 8]);
      ctx.beginPath();
      ctx.arc(0, 0, this.radius - 2, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();

      // Counter-rotating inner energy coils
      ctx.save();
      ctx.rotate(-this.ringAngle * 1.5);
      ctx.strokeStyle = '#38bdf8';
      ctx.lineWidth = 2.5;
      ctx.setLineDash([8, 6]);
      ctx.beginPath();
      ctx.arc(0, 0, this.radius - 16, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();

      // Supercharged Core
      const coreGrad = ctx.createRadialGradient(0, 0, 2, 0, 0, 18);
      coreGrad.addColorStop(0, '#ffffff');
      coreGrad.addColorStop(0.4, '#38bdf8');
      coreGrad.addColorStop(1, '#0369a1');
      ctx.fillStyle = coreGrad;
      ctx.beginPath();
      ctx.arc(0, 0, 16 + Math.sin(this.pulse) * 2, 0, Math.PI * 2);
      ctx.fill();

      // 4 Heavy Power Conduits
      for (let i = 0; i < 4; i++) {
        const ang = (i * Math.PI) / 2;
        ctx.fillStyle = '#64748b';
        ctx.fillRect(Math.cos(ang) * 42 - 5, Math.sin(ang) * 42 - 5, 10, 10);
      }

      ctx.restore();

      // Holographic Prompt floating above machine
      ctx.save();
      ctx.textAlign = 'center';
      const promptY = this.y - this.radius - 24;

      if (playerDist <= 110) {
        // Active interactive range
        ctx.fillStyle = 'rgba(15, 23, 42, 0.9)';
        ctx.beginPath();
        ctx.roundRect(this.x - 140, promptY - 18, 280, 36, 6);
        ctx.fill();
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.fillStyle = '#38bdf8';
        ctx.font = 'bold 14px sans-serif';
        ctx.fillText('⚡ PRESS [F] TO UPGRADE WEAPON ⚡', this.x, promptY + 5);
      } else {
        ctx.fillStyle = '#38bdf8';
        ctx.font = '900 12px monospace';
        ctx.fillText('CYBER-FORGE MACHINE [ACTIVE]', this.x, promptY);
      }
      ctx.restore();
    }
  }

  // =========================================================================
  // 6. GRENADES & CLAYMORE MINES
  // =========================================================================
  class Grenade {
    constructor(x, y, vx, vy) {
      this.x = x;
      this.y = y;
      this.vx = vx;
      this.vy = vy;
      this.fuse = 1.35;
      this.radius = 7;
      this.dead = false;
    }

    update(dt) {
      this.x += this.vx * dt;
      this.y += this.vy * dt;
      this.vx *= 0.93;
      this.vy *= 0.93;
      this.fuse -= dt;
      if (this.fuse <= 0) {
        this.dead = true;
      }
    }

    draw(ctx) {
      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.fillStyle = '#1e3a1e';
      ctx.beginPath();
      ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#4ade80';
      ctx.lineWidth = 1.5;
      ctx.stroke();

      // Blinking red fuse indicator
      const blink = Math.sin(Date.now() * 0.02) > 0;
      ctx.fillStyle = blink ? '#ef4444' : '#7f1d1d';
      ctx.beginPath();
      ctx.arc(0, -3, 2.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  }

  class ClaymoreMine {
    constructor(x, y, angle) {
      this.x = x;
      this.y = y;
      this.angle = angle;
      this.armTimer = 0.8;
      this.armed = false;
      this.dead = false;
      this.triggerRadius = 65;
    }

    update(dt, zombies) {
      if (!this.armed) {
        this.armTimer -= dt;
        if (this.armTimer <= 0) this.armed = true;
        return;
      }

      for (let i = 0; i < zombies.length; i++) {
        const z = zombies[i];
        if (z.dead) continue;
        const d = Math.hypot(z.x - this.x, z.y - this.y);
        if (d <= this.triggerRadius) {
          this.dead = true;
          break;
        }
      }
    }

    draw(ctx) {
      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.rotate(this.angle);

      // Rectangular curved claymore casing
      ctx.fillStyle = '#334155';
      ctx.fillRect(-12, -6, 24, 12);
      ctx.strokeStyle = '#0f172a';
      ctx.lineWidth = 1.5;
      ctx.strokeRect(-12, -6, 24, 12);

      // Warning chevron text
      ctx.fillStyle = '#fbbf24';
      ctx.font = 'bold 7px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('FRONT', 0, 3);

      // Active laser tripwire beams
      if (this.armed) {
        ctx.strokeStyle = 'rgba(239, 68, 68, 0.45)';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(40, -20);
        ctx.moveTo(0, 0);
        ctx.lineTo(45, 0);
        ctx.moveTo(0, 0);
        ctx.lineTo(40, 20);
        ctx.stroke();
      }
      ctx.restore();
    }
  }

  // =========================================================================
  // 7. ENTITIES: BULLETS, PARTICLES, POPUPS, PICKUPS
  // =========================================================================
  class Bullet {
    constructor(x, y, vx, vy, damage, range, color, size, pierce, knockback, incendiary, overclock = null) {
      this.x = x;
      this.y = y;
      this.prevX = x;
      this.prevY = y;
      this.vx = vx;
      this.vy = vy;
      this.damage = damage;
      this.distanceTraveled = 0;
      this.maxRange = range || 1800;
      this.color = color || '#fbbf24';
      this.size = size || 4;
      this.pierce = pierce || 0;
      this.knockback = knockback || 1.0;
      this.incendiary = !!incendiary;
      this.overclock = overclock;
      this.hitEnemies = new Set();
      this.dead = false;
    }

    update(dt) {
      this.prevX = this.x;
      this.prevY = this.y;
      this.x += this.vx * dt;
      this.y += this.vy * dt;
      this.distanceTraveled += Math.hypot(this.vx * dt, this.vy * dt);

      if (this.distanceTraveled >= this.maxRange ||
          this.x < 30 || this.x > CONFIG.VIRTUAL_WIDTH - 30 ||
          this.y < 30 || this.y > CONFIG.VIRTUAL_HEIGHT - 30) {
        this.dead = true;
      }
    }

    draw(ctx) {
      ctx.save();
      ctx.strokeStyle = this.color;
      ctx.lineWidth = this.size;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(this.prevX, this.prevY);
      ctx.lineTo(this.x, this.y);
      ctx.stroke();

      // Outer glow for overclocked bullets
      if (this.overclock) {
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
        ctx.lineWidth = this.size * 0.4;
        ctx.stroke();
      }

      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size * 0.75, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  }

  class Particle {
    constructor(x, y, vx, vy, color, size, life, isBlood = false) {
      this.x = x;
      this.y = y;
      this.vx = vx;
      this.vy = vy;
      this.color = color;
      this.size = size;
      this.maxLife = life;
      this.life = life;
      this.isBlood = isBlood;
    }

    update(dt) {
      this.x += this.vx * dt;
      this.y += this.vy * dt;
      this.vx *= 0.92;
      this.vy *= 0.92;
      this.life -= dt;
    }

    draw(ctx) {
      const alpha = Math.max(0, this.life / this.maxLife);
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.fillStyle = this.color;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size * (this.isBlood ? 1 : alpha), 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  }

  class ScorePopup {
    constructor(x, y, text, color = '#fbbf24', size = 18) {
      this.x = x;
      this.y = y;
      this.text = text;
      this.color = color;
      this.size = size;
      this.life = 1.0;
      this.maxLife = 1.0;
    }

    update(dt) {
      this.y -= 38 * dt;
      this.life -= dt;
    }

    draw(ctx) {
      const alpha = Math.max(0, this.life / this.maxLife);
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.font = `bold ${this.size}px -apple-system, sans-serif`;
      ctx.textAlign = 'center';
      ctx.fillStyle = '#000000';
      ctx.fillText(this.text, this.x + 1, this.y + 1);
      ctx.fillStyle = this.color;
      ctx.fillText(this.text, this.x, this.y);
      ctx.restore();
    }
  }

  class Pickup {
    constructor(x, y, type) {
      this.x = x;
      this.y = y;
      this.type = type;
      this.radius = 16;
      this.life = CONFIG.PICKUP_DURATION;
      this.pulse = 0;
    }

    update(dt) {
      this.life -= dt;
      this.pulse += dt * 4;
    }

    draw(ctx) {
      ctx.save();
      const alpha = this.life < 4 ? (Math.sin(this.life * 14) > 0 ? 0.3 : 1) : 1;
      ctx.globalAlpha = alpha;
      const scale = 1 + Math.sin(this.pulse) * 0.08;

      if (this.type === 'medkit') {
        ctx.fillStyle = '#064e3b';
        ctx.strokeStyle = '#10b981';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.roundRect(this.x - 14 * scale, this.y - 14 * scale, 28 * scale, 28 * scale, 6);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = '#ef4444';
        ctx.fillRect(this.x - 3, this.y - 9, 6, 18);
        ctx.fillRect(this.x - 9, this.y - 3, 18, 6);
      } else {
        ctx.fillStyle = '#78350f';
        ctx.strokeStyle = '#f59e0b';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.roundRect(this.x - 15 * scale, this.y - 12 * scale, 30 * scale, 24 * scale, 4);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = '#fbbf24';
        ctx.font = 'bold 12px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('AMMO', this.x, this.y);
      }
      ctx.restore();
    }
  }

  // =========================================================================
  // 8. REALISTIC MONSTERS (WALKER, RUNNER, GOLIATH BRUTE, ACID SPITTER)
  // Programmatic anatomical rendering with shambling limbs, wounds, and claws
  // =========================================================================
  class Zombie {
    constructor(x, y, typeKey, roundNumber, mapKey = 'outpost') {
      this.typeKey = typeKey;
      this.mapKey = mapKey || 'outpost';
      const archetype = ZOMBIE_TYPES[typeKey] || ZOMBIE_TYPES.walker;
      this.archetype = archetype;

      const mapDef = MAPS[this.mapKey] || MAPS.outpost;
      const reg = (mapDef && mapDef.zombies && mapDef.zombies[typeKey]) ? mapDef.zombies[typeKey] : null;
      this.regionalName = reg ? reg.name : archetype.name;
      this.regionalSubtitle = reg ? reg.subtitle : archetype.name;
      this.themeColor = reg ? reg.color : archetype.color;
      this.themeDecayColor = reg ? reg.decayColor : archetype.decayColor;

      this.x = x;
      this.y = y;
      this.vx = 0;
      this.vy = 0;
      this.radius = archetype.radius;

      const roundFactor = Math.max(0, roundNumber - 1);
      this.maxHp = Math.round(archetype.baseHp + roundFactor * archetype.hpGrowth);
      this.hp = this.maxHp;
      this.speed = Math.min(archetype.maxSpeed, archetype.baseSpeed + roundFactor * archetype.speedGrowth);
      this.damage = Math.round(archetype.damage + roundFactor * archetype.dmgGrowth);
      this.attackCooldown = archetype.attackCooldown;
      this.attackTimer = 0;

      this.angle = 0;
      this.hitFlash = 0;
      this.walkCycle = Math.random() * Math.PI * 2;
      this.dead = false;
      this.burnTimer = 0;
      this.freezeTimer = 0;
      this.spitTimer = Math.random() * 2;
    }

    takeDamage(amount, knockbackDist, fromAngle, isIncendiary, isCryo) {
      this.hp -= amount;
      this.hitFlash = 0.12;

      if (knockbackDist) {
        this.x += Math.cos(fromAngle) * knockbackDist * 16;
        this.y += Math.sin(fromAngle) * knockbackDist * 16;
      }

      if (isIncendiary) this.burnTimer = 2.5;
      if (isCryo) this.freezeTimer = 2.2;

      if (this.hp <= 0) {
        this.dead = true;
      }
    }

    update(dt, player, allZombies, obstacles, acidPools) {
      if (this.dead) return;

      if (this.hitFlash > 0) this.hitFlash -= dt;
      if (this.attackTimer > 0) this.attackTimer -= dt;

      // Burning damage tick
      if (this.burnTimer > 0) {
        this.burnTimer -= dt;
        this.hp -= 24 * dt;
        if (this.hp <= 0) this.dead = true;
      }

      // Freeze slow
      let currentSpeed = this.speed;
      if (this.freezeTimer > 0) {
        this.freezeTimer -= dt;
        currentSpeed *= 0.35;
      }

      // Steering towards player
      const dx = player.x - this.x;
      const dy = player.y - this.y;
      const distToPlayer = Math.hypot(dx, dy);
      this.angle = Math.atan2(dy, dx);

      this.walkCycle += dt * (currentSpeed / 20);

      // Acid Spitter ranged attack
      if (this.typeKey === 'spitter' && distToPlayer < 450 && distToPlayer > 120) {
        this.spitTimer -= dt;
        if (this.spitTimer <= 0) {
          this.spitTimer = this.archetype.spitCooldown;
          acidPools.push({
            x: player.x + (Math.random() - 0.5) * 40,
            y: player.y + (Math.random() - 0.5) * 40,
            radius: 28,
            life: 4.5,
            damageTimer: 0
          });
        }
      }

      let steerX = Math.cos(this.angle) * currentSpeed;
      let steerY = Math.sin(this.angle) * currentSpeed;

      // Soft separation force
      let sepX = 0;
      let sepY = 0;
      for (let i = 0; i < allZombies.length; i++) {
        const other = allZombies[i];
        if (other === this || other.dead) continue;
        const ox = this.x - other.x;
        const oy = this.y - other.y;
        const oDist = Math.hypot(ox, oy);
        const minDist = this.radius + other.radius + 4;
        if (oDist > 0 && oDist < minDist) {
          const force = (minDist - oDist) / minDist;
          sepX += (ox / oDist) * force * 140;
          sepY += (oy / oDist) * force * 140;
        }
      }

      steerX += sepX;
      steerY += sepY;

      this.x += steerX * dt;
      resolveObstacleCollision(this, obstacles);

      this.y += steerY * dt;
      resolveObstacleCollision(this, obstacles);

      // Arena boundary limits
      this.x = Math.max(45 + this.radius, Math.min(CONFIG.VIRTUAL_WIDTH - 45 - this.radius, this.x));
      this.y = Math.max(45 + this.radius, Math.min(CONFIG.VIRTUAL_HEIGHT - 45 - this.radius, this.y));

      // Contact hit
      if (distToPlayer <= this.radius + player.radius) {
        if (this.attackTimer <= 0) {
          player.takeDamage(this.damage);
          this.attackTimer = this.attackCooldown;
        }
      }
    }

    draw(ctx) {
      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.rotate(this.angle);

      // Shambling limb offset
      const stride = Math.sin(this.walkCycle) * (this.radius * 0.35);

      // Color scheme based on status and map theme
      let primaryColor = this.themeColor || this.archetype.color;
      let decayColor = this.themeDecayColor || this.archetype.decayColor;

      if (this.hitFlash > 0) {
        primaryColor = '#ffffff';
        decayColor = '#e2e8f0';
      } else if (this.freezeTimer > 0) {
        primaryColor = '#7dd3fc';
        decayColor = '#0284c7';
      } else if (this.burnTimer > 0) {
        primaryColor = '#f97316';
        decayColor = '#c2410c';
      }

      if (this.typeKey === 'brute') {
        // GOLIATH BRUTE: Massive mutated silhouette with stone carapace & pulsing pustules
        // Legs
        ctx.fillStyle = '#292524';
        ctx.fillRect(-18, -16 + stride, 14, 10);
        ctx.fillRect(-18, 6 - stride, 14, 10);

        // Huge Torso with Carapace
        ctx.fillStyle = decayColor;
        ctx.beginPath();
        ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#1c1917';
        ctx.lineWidth = 4;
        ctx.stroke();

        // Mutated armored shoulder guards
        ctx.fillStyle = '#44403c';
        ctx.beginPath();
        ctx.arc(2, -this.radius * 0.7, 10, 0, Math.PI * 2);
        ctx.arc(2, this.radius * 0.7, 10, 0, Math.PI * 2);
        ctx.fill();

        // Pulsing bio-pustules
        const pulseSize = 4 + Math.sin(this.walkCycle * 2) * 1.5;
        ctx.fillStyle = '#eab308';
        ctx.beginPath();
        ctx.arc(-6, -8, pulseSize, 0, Math.PI * 2);
        ctx.arc(-2, 8, pulseSize * 0.8, 0, Math.PI * 2);
        ctx.fill();

        // Massive mutated hammer fists
        ctx.fillStyle = '#78350f';
        ctx.fillRect(this.radius * 0.5, -this.radius * 0.85, 16, 12);
        ctx.fillRect(this.radius * 0.5, this.radius * 0.35, 16, 12);

        // Glowing feral yellow eyes
        ctx.fillStyle = '#facc15';
        ctx.beginPath();
        ctx.arc(this.radius * 0.55, -6, 3, 0, Math.PI * 2);
        ctx.arc(this.radius * 0.55, 6, 3, 0, Math.PI * 2);
        ctx.fill();

      } else if (this.typeKey === 'runner') {
        // FERAL STALKER: Sinewy, hunched, aggressive talons
        // Lean elongated body
        ctx.fillStyle = decayColor;
        ctx.beginPath();
        ctx.ellipse(0, 0, this.radius + 4, this.radius - 2, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#450a0a';
        ctx.lineWidth = 2.5;
        ctx.stroke();

        // Exposed spine vertebrae
        ctx.fillStyle = '#fecaca';
        for (let s = -8; s <= 6; s += 4) {
          ctx.fillRect(s, -2, 2, 4);
        }

        // Lunging Claws / Talons
        ctx.fillStyle = '#991b1b';
        ctx.beginPath();
        ctx.moveTo(this.radius * 0.4, -this.radius * 0.8);
        ctx.lineTo(this.radius * 1.2 + stride, -this.radius * 0.6);
        ctx.lineTo(this.radius * 0.4, -this.radius * 0.3);
        ctx.fill();

        ctx.beginPath();
        ctx.moveTo(this.radius * 0.4, this.radius * 0.3);
        ctx.lineTo(this.radius * 1.2 - stride, this.radius * 0.6);
        ctx.lineTo(this.radius * 0.4, this.radius * 0.8);
        ctx.fill();

        // Glowing crimson predatory eyes
        ctx.fillStyle = '#ff0000';
        ctx.beginPath();
        ctx.arc(this.radius * 0.6, -4, 2.5, 0, Math.PI * 2);
        ctx.arc(this.radius * 0.6, 4, 2.5, 0, Math.PI * 2);
        ctx.fill();

      } else if (this.typeKey === 'spitter') {
        // ACID FIEND: Bioluminescent toxic sacs & bile jaw
        ctx.fillStyle = decayColor;
        ctx.beginPath();
        ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
        ctx.fill();

        // Glowing toxic green nodules
        ctx.fillStyle = '#22c55e';
        ctx.beginPath();
        ctx.arc(-4, -6, 5, 0, Math.PI * 2);
        ctx.arc(-6, 4, 4.5, 0, Math.PI * 2);
        ctx.arc(4, 0, 4, 0, Math.PI * 2);
        ctx.fill();

        // Snapping toxic jaw
        ctx.fillStyle = '#15803d';
        ctx.fillRect(this.radius * 0.4, -6, 10, 12);

        ctx.fillStyle = '#a3e635';
        ctx.beginPath();
        ctx.arc(this.radius * 0.6, -3, 2, 0, Math.PI * 2);
        ctx.arc(this.radius * 0.6, 3, 2, 0, Math.PI * 2);
        ctx.fill();

      } else {
        // DECAYED WALKER: Classic decaying zombie with torn cloth & reaching claws
        // Shambling Drag Feet
        ctx.fillStyle = '#1c1917';
        ctx.fillRect(-12, -10 + stride, 8, 6);
        ctx.fillRect(-12, 4 - stride, 8, 6);

        // Rotting Torso with torn clothes
        ctx.fillStyle = primaryColor;
        ctx.beginPath();
        ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.lineWidth = 2.5;
        ctx.strokeStyle = decayColor;
        ctx.stroke();

        // Exposed decaying chest wound
        ctx.fillStyle = '#881337';
        ctx.fillRect(-2, -4, 5, 8);

        // Reaching decayed arms
        ctx.fillStyle = decayColor;
        ctx.fillRect(this.radius * 0.4, -this.radius * 0.75 + stride * 0.5, this.radius * 0.8, 5);
        ctx.fillRect(this.radius * 0.4, this.radius * 0.35 - stride * 0.5, this.radius * 0.8, 5);

        // Claws
        ctx.fillStyle = '#fecdd3';
        ctx.fillRect(this.radius * 1.1, -this.radius * 0.75 + stride * 0.5, 3, 5);
        ctx.fillRect(this.radius * 1.1, this.radius * 0.35 - stride * 0.5, 3, 5);

        // Glowing feral eyes
        ctx.fillStyle = primaryColor;
        ctx.beginPath();
        ctx.arc(this.radius * 0.5, -4, 2.5, 0, Math.PI * 2);
        ctx.arc(this.radius * 0.5, 4, 2.5, 0, Math.PI * 2);
        ctx.fill();
      }

      // REGIONAL BIOME DISTINCTIVE ANATOMICAL FLOURISHES
      if (this.mapKey === 'ice') {
        // Cryo Tundra: Pale frosted crystalline spikes
        ctx.fillStyle = '#a5f3fc';
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 1.2;
        for (let i = -1; i <= 1; i++) {
          ctx.beginPath();
          ctx.moveTo(-this.radius * 0.3 + i * 8, -this.radius * 0.65);
          ctx.lineTo(-this.radius * 0.1 + i * 8, -this.radius * 1.15);
          ctx.lineTo(this.radius * 0.1 + i * 8, -this.radius * 0.65);
          ctx.closePath();
          ctx.fill();
          ctx.stroke();
        }
      } else if (this.mapKey === 'jungle') {
        // Toxic Jungle: Spore clusters & creeping thorny vines
        ctx.fillStyle = '#15803d';
        ctx.fillRect(-this.radius * 0.5, -3, this.radius, 4);
        ctx.fillStyle = '#a3e635';
        ctx.beginPath();
        ctx.arc(-this.radius * 0.4, -this.radius * 0.5, 4.5, 0, Math.PI * 2);
        ctx.arc(-this.radius * 0.2, this.radius * 0.5, 4, 0, Math.PI * 2);
        ctx.fill();
      } else if (this.mapKey === 'desert') {
        // Scorched Dunes: Sand-dusted mummy gauze wraps
        ctx.fillStyle = 'rgba(251, 191, 36, 0.4)';
        for (let w = -this.radius * 0.6; w <= this.radius * 0.4; w += 6) {
          ctx.fillRect(w, -this.radius * 0.5, 2.5, this.radius);
        }
      } else if (this.mapKey === 'city') {
        // Neon Metropolis: Quarantined SWAT riot chest armor & cyber optic visor
        ctx.fillStyle = '#1e1b4b';
        ctx.fillRect(-this.radius * 0.4, -this.radius * 0.4, this.radius * 0.8, this.radius * 0.8);
        ctx.strokeStyle = '#f472b6';
        ctx.lineWidth = 1.2;
        ctx.strokeRect(-this.radius * 0.4, -this.radius * 0.4, this.radius * 0.8, this.radius * 0.8);
        ctx.fillStyle = '#38bdf8';
        ctx.fillRect(this.radius * 0.3, -4, 4, 8);
      } else {
        // Outpost Zero: Biohazard yellow striped warning collar
        ctx.fillStyle = '#eab308';
        ctx.fillRect(-this.radius * 0.4, -2, this.radius * 0.8, 4);
      }

      ctx.restore();

      // Health Bar
      if (this.hp < this.maxHp) {
        ctx.save();
        const barW = this.radius * 2.2;
        const barH = 4;
        const pct = Math.max(0, this.hp / this.maxHp);
        ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
        ctx.fillRect(this.x - barW / 2, this.y - this.radius - 10, barW, barH);
        ctx.fillStyle = pct > 0.5 ? '#22c55e' : (pct > 0.25 ? '#eab308' : '#ef4444');
        ctx.fillRect(this.x - barW / 2, this.y - this.radius - 10, barW * pct, barH);
        ctx.restore();
      }
    }
  }

  // =========================================================================
  // 9. REALISTIC OPERATIVE CONTROLLER (PLAYER)
  // Procedural military camo vest, combat boots with walking strides,
  // night vision goggles visor, laser targeting sight, and weapon recoil
  // =========================================================================
  class Player {
    constructor(startingWeaponKey = 'lmg') {
      this.x = CONFIG.VIRTUAL_WIDTH / 2;
      this.y = CONFIG.VIRTUAL_HEIGHT / 2;
      this.vx = 0;
      this.vy = 0;
      this.radius = CONFIG.PLAYER_RADIUS;
      this.speed = CONFIG.PLAYER_SPEED;
      this.speedMultiplier = 1.0;
      this.medkitBonus = 0;
      this.bulletSpeedMultiplier = 1.0;
      this.currentMapKey = 'outpost';

      this.hp = CONFIG.PLAYER_MAX_HP;
      this.maxHp = CONFIG.PLAYER_MAX_HP;
      this.armor = 25; // Base starting light armor
      this.maxArmor = CONFIG.PLAYER_MAX_ARMOR;
      this.invulnTimer = 0;
      this.aimAngle = 0;

      this.walkCycle = 0;
      this.isMoving = false;
      this.recoilKick = 0;

      // Tactical Consumables
      this.grenades = 2;
      this.mines = 1;
      this.adrenalineTimer = 0;

      // Weapon Inventory & States
      this.inventory = ['lmg', 'smg', 'shotgun', 'pistols'];
      this.weaponsState = {
        lmg: { tierIndex: 0, magAmmo: WEAPONS.lmg.tiers[0].magSize, reserveAmmo: WEAPONS.lmg.tiers[0].maxReserve, overclock: null },
        smg: { tierIndex: 0, magAmmo: WEAPONS.smg.tiers[0].magSize, reserveAmmo: WEAPONS.smg.tiers[0].maxReserve, overclock: null },
        shotgun: { tierIndex: 0, magAmmo: WEAPONS.shotgun.tiers[0].magSize, reserveAmmo: WEAPONS.shotgun.tiers[0].maxReserve, overclock: null },
        pistols: { tierIndex: 0, magAmmo: WEAPONS.pistols.tiers[0].magSize, reserveAmmo: Infinity, overclock: null }
      };

      this.activeWeaponKey = startingWeaponKey || 'lmg';
      this.fireTimer = 0;
      this.isReloading = false;
      this.reloadTimer = 0;
      this.reloadTotalTime = 2.0;
      this.muzzleFlash = 0;
      this.dualToggle = false;

      // Score
      this.score = 0;
      this.totalKills = 0;
      this.shotsFired = 0;
      this.shotsHit = 0;
    }

    applyMapPerk(mapKey) {
      this.currentMapKey = mapKey || 'outpost';
      this.speedMultiplier = 1.0;
      this.medkitBonus = 0;
      this.bulletSpeedMultiplier = 1.0;

      if (mapKey === 'ice') {
        // Permafrost Slip: +12% sprint speed & fluid movement
        this.speedMultiplier = 1.12;
      } else if (mapKey === 'jungle') {
        // Bio-Vigor: +15 HP from medkits
        this.medkitBonus = 15;
      } else if (mapKey === 'desert') {
        // Heat Dispersion: +10% projectile velocity
        this.bulletSpeedMultiplier = 1.10;
      } else if (mapKey === 'city') {
        // Urban Cache: +20% starting reserve ammo
        for (let k in this.weaponsState) {
          const stats = WEAPONS[k].tiers[this.weaponsState[k].tierIndex];
          if (stats.maxReserve !== Infinity) {
            this.weaponsState[k].reserveAmmo = Math.round(stats.maxReserve * 1.20);
          }
        }
      }
    }

    get weaponKey() {
      return this.activeWeaponKey;
    }

    get tierIndex() {
      return this.weaponsState[this.activeWeaponKey].tierIndex;
    }

    set tierIndex(val) {
      this.weaponsState[this.activeWeaponKey].tierIndex = val;
    }

    get magAmmo() {
      return this.weaponsState[this.activeWeaponKey].magAmmo;
    }

    set magAmmo(val) {
      this.weaponsState[this.activeWeaponKey].magAmmo = val;
    }

    get reserveAmmo() {
      return this.weaponsState[this.activeWeaponKey].reserveAmmo;
    }

    set reserveAmmo(val) {
      this.weaponsState[this.activeWeaponKey].reserveAmmo = val;
    }

    get currentOverclock() {
      return this.weaponsState[this.activeWeaponKey].overclock;
    }

    set currentOverclock(val) {
      this.weaponsState[this.activeWeaponKey].overclock = val;
    }

    getCurrentTierStats() {
      return WEAPONS[this.activeWeaponKey].tiers[this.tierIndex];
    }

    switchWeapon(newKey) {
      if (!this.weaponsState[newKey] || this.activeWeaponKey === newKey) return;
      this.isReloading = false;
      this.reloadTimer = 0;
      this.fireTimer = 0.2;
      this.activeWeaponKey = newKey;
      audio.playWeaponSwitch();
    }

    cycleWeapon(direction) {
      const curIdx = this.inventory.indexOf(this.activeWeaponKey);
      const nextIdx = (curIdx + direction + this.inventory.length) % this.inventory.length;
      this.switchWeapon(this.inventory[nextIdx]);
    }

    takeDamage(amount) {
      if (this.invulnTimer > 0) return;

      // Armor absorbs 70% of damage until depleted
      if (this.armor > 0) {
        const armorAbsorb = amount * 0.7;
        const directDmg = amount * 0.3;
        this.armor = Math.max(0, this.armor - armorAbsorb);
        this.hp = Math.max(0, this.hp - directDmg);
      } else {
        this.hp = Math.max(0, this.hp - amount);
      }

      this.invulnTimer = CONFIG.PLAYER_INVULN_TIME;
      audio.playPlayerDamage();
    }

    heal(amount) {
      const finalAmt = amount + (this.medkitBonus || 0);
      this.hp = Math.min(this.maxHp, this.hp + finalAmt);
    }

    repairArmor(amount) {
      this.armor = Math.min(this.maxArmor, this.armor + amount);
    }

    refillAmmo(percent) {
      for (let i = 0; i < this.inventory.length; i++) {
        const key = this.inventory[i];
        const state = this.weaponsState[key];
        const stats = WEAPONS[key].tiers[state.tierIndex];
        if (stats.maxReserve !== Infinity) {
          const add = Math.round(stats.maxReserve * percent);
          state.reserveAmmo = Math.min(stats.maxReserve, state.reserveAmmo + add);
        }
      }
      const curStats = this.getCurrentTierStats();
      this.magAmmo = curStats.magSize;
      this.isReloading = false;
      this.reloadTimer = 0;
    }

    throwGrenade(grenadesList) {
      if (this.grenades <= 0) return;
      this.grenades--;
      const vx = Math.cos(this.aimAngle) * 580;
      const vy = Math.sin(this.aimAngle) * 580;
      grenadesList.push(new Grenade(this.x, this.y, vx, vy));
    }

    plantMine(minesList) {
      if (this.mines <= 0) return;
      this.mines--;
      minesList.push(new ClaymoreMine(this.x, this.y, this.aimAngle));
      audio.playReloadFinish();
    }

    upgradeWeapon() {
      if (this.tierIndex < 3) {
        const nextCost = CONFIG.UPGRADE_COSTS[this.tierIndex];
        if (this.score >= nextCost) {
          this.score -= nextCost;
          this.tierIndex++;
          const newStats = this.getCurrentTierStats();
          this.magAmmo = newStats.magSize;
          if (newStats.maxReserve !== Infinity) {
            this.reserveAmmo = newStats.maxReserve;
          }
          this.isReloading = false;
          this.reloadTimer = 0;
          audio.playRoundComplete();
          return true;
        }
      }
      return false;
    }

    applyCyberOverclock(overclockKey) {
      if (!CYBER_OVERCLOCKS[overclockKey]) return false;
      if (this.score >= CONFIG.CYBER_OVERCLOCK_COST) {
        this.score -= CONFIG.CYBER_OVERCLOCK_COST;
        this.currentOverclock = overclockKey;
        this.refillAmmo(1.0);
        audio.playCyberForgeActivate();
        sessionDashboard.sessionData.cyberForgeOverclocksPerformed++;
        sessionDashboard.save();
        return true;
      }
      return false;
    }

    startReload() {
      const stats = this.getCurrentTierStats();
      if (this.isReloading) return;
      if (this.magAmmo === stats.magSize) return;
      if (stats.maxReserve !== Infinity && this.reserveAmmo <= 0) return;

      this.isReloading = true;
      this.reloadTotalTime = stats.reloadTime;
      this.reloadTimer = this.reloadTotalTime;
      audio.playReloadStart();
    }

    finishReload() {
      const stats = this.getCurrentTierStats();
      const needed = stats.magSize - this.magAmmo;

      if (stats.maxReserve === Infinity) {
        this.magAmmo = stats.magSize;
      } else {
        const take = Math.min(needed, this.reserveAmmo);
        this.magAmmo += take;
        this.reserveAmmo -= take;
      }

      this.isReloading = false;
      this.reloadTimer = 0;
      audio.playReloadFinish();
    }

    update(dt, input, obstacles, bullets, particles) {
      if (this.invulnTimer > 0) this.invulnTimer -= dt;
      if (this.muzzleFlash > 0) this.muzzleFlash -= dt;
      if (this.recoilKick > 0) this.recoilKick = Math.max(0, this.recoilKick - dt * 25);
      if (this.adrenalineTimer > 0) this.adrenalineTimer -= dt;

      // 1. Aim toward crosshair
      if (input.isTouch) {
        if (input.aimStick.active) {
          this.aimAngle = input.aimStick.angle;
        } else if (input.moveStick.dx !== 0 || input.moveStick.dy !== 0) {
          this.aimAngle = Math.atan2(input.moveStick.dy, input.moveStick.dx);
        }
      } else {
        const dx = input.mouse.x - this.x;
        const dy = input.mouse.y - this.y;
        this.aimAngle = Math.atan2(dy, dx);
      }

      // 2. Smooth movement with WASD and Arrow Keys
      let targetVx = 0;
      let targetVy = 0;

      const isUp = input.isDown('w') || input.isDown('keyw') || input.isDown('arrowup');
      const isDown = input.isDown('s') || input.isDown('keys') || input.isDown('arrowdown');
      const isLeft = input.isDown('a') || input.isDown('keya') || input.isDown('arrowleft');
      const isRight = input.isDown('d') || input.isDown('keyd') || input.isDown('arrowright');

      if (isUp) targetVy -= 1;
      if (isDown) targetVy += 1;
      if (isLeft) targetVx -= 1;
      if (isRight) targetVx += 1;

      if (targetVx !== 0 && targetVy !== 0) {
        const invSqrt2 = 0.70710678;
        targetVx *= invSqrt2;
        targetVy *= invSqrt2;
      }

      // Analog thumbstick movement on touch devices
      if (input.isTouch && (input.moveStick.dx !== 0 || input.moveStick.dy !== 0)) {
        targetVx = input.moveStick.dx;
        targetVy = input.moveStick.dy;
      }

      const activeSpeed = this.speed * (this.speedMultiplier || 1.0) * (this.adrenalineTimer > 0 ? 1.3 : 1.0);
      targetVx *= activeSpeed;
      targetVy *= activeSpeed;

      // Smooth inertia
      this.vx += (targetVx - this.vx) * Math.min(1, dt * 18);
      this.vy += (targetVy - this.vy) * Math.min(1, dt * 18);

      this.isMoving = Math.hypot(this.vx, this.vy) > 10;
      if (this.isMoving) {
        this.walkCycle += dt * 14;
      }

      this.x += this.vx * dt;
      resolveObstacleCollision(this, obstacles);

      this.y += this.vy * dt;
      resolveObstacleCollision(this, obstacles);

      this.x = Math.max(45 + this.radius, Math.min(CONFIG.VIRTUAL_WIDTH - 45 - this.radius, this.x));
      this.y = Math.max(45 + this.radius, Math.min(CONFIG.VIRTUAL_HEIGHT - 45 - this.radius, this.y));

      // 3. Reload logic
      if (this.isReloading) {
        this.reloadTimer -= dt;
        if (this.reloadTimer <= 0) {
          this.finishReload();
        }
      }

      // 4. Weapon firing
      const stats = this.getCurrentTierStats();
      const fireInterval = 1 / stats.fireRate;
      if (this.fireTimer > 0) this.fireTimer -= dt;

      if ((input.mouse.down || input.touchFiring) && this.fireTimer <= 0) {
        if (!this.isReloading) {
          if (this.magAmmo <= 0) {
            audio.playEmptyClick();
            this.fireTimer = 0.3;
            this.startReload();
          } else {
            this.fireShot(bullets, particles, stats);
            this.fireTimer = fireInterval;
          }
        }
      }
    }

    fireShot(bullets, particles, stats) {
      this.magAmmo--;
      this.shotsFired++;
      this.muzzleFlash = 0.08;
      this.recoilKick = 4.5;
      sessionDashboard.recordShot(false);

      const oc = this.currentOverclock ? CYBER_OVERCLOCKS[this.currentOverclock] : null;
      audio.playShoot(this.activeWeaponKey, this.tierIndex, this.currentOverclock);

      const pellets = stats.pellets || 1;

      for (let p = 0; p < pellets; p++) {
        const spreadOffset = (Math.random() - 0.5) * stats.spread * 2;
        const shotAngle = this.aimAngle + spreadOffset;

        let spawnX = this.x + Math.cos(this.aimAngle) * (this.radius + 16);
        let spawnY = this.y + Math.sin(this.aimAngle) * (this.radius + 16);

        if (this.activeWeaponKey === 'pistols') {
          const perpAngle = this.aimAngle + Math.PI / 2;
          const barrelOffset = this.dualToggle ? 9 : -9;
          spawnX += Math.cos(perpAngle) * barrelOffset;
          spawnY += Math.sin(perpAngle) * barrelOffset;
        }

        const bSpd = stats.bulletSpeed * (this.bulletSpeedMultiplier || 1.0);
        const vx = Math.cos(shotAngle) * bSpd;
        const vy = Math.sin(shotAngle) * bSpd;

        let dmg = stats.damage;
        if (oc) dmg *= oc.damageBoost;
        if (stats.critChance && Math.random() < stats.critChance) {
          dmg *= 2;
        }

        const bColor = oc ? oc.bulletColor : stats.bulletColor;
        const bPierce = (stats.pierce || 0) + (oc && oc.pierceAdd ? oc.pierceAdd : 0);

        bullets.push(new Bullet(
          spawnX, spawnY, vx, vy,
          dmg,
          1600,
          bColor,
          stats.bulletSize,
          bPierce,
          stats.knockback || 1.0,
          stats.incendiary || false,
          this.currentOverclock
        ));

        // Muzzle smoke & spark particles
        particles.push(new Particle(
          spawnX, spawnY,
          (Math.random() - 0.5) * 60 + vx * 0.08,
          (Math.random() - 0.5) * 60 + vy * 0.08,
          oc ? oc.color : '#94a3b8',
          Math.random() * 3 + 2,
          0.22
        ));
      }

      this.dualToggle = !this.dualToggle;

      if (this.magAmmo === 0) {
        if (settingsManager.data.autoReload) {
          this.startReload();
        }
      }
    }

    draw(ctx) {
      const stats = this.getCurrentTierStats();
      const oc = this.currentOverclock ? CYBER_OVERCLOCKS[this.currentOverclock] : null;

      ctx.save();
      ctx.translate(this.x, this.y);

      // Realistic Soft Shadow
      ctx.fillStyle = 'rgba(0, 0, 0, 0.45)';
      ctx.beginPath();
      ctx.ellipse(3, 8, this.radius + 4, this.radius * 0.7, 0, 0, Math.PI * 2);
      ctx.fill();

      // Recoil pushback along aim angle
      const recoilX = -Math.cos(this.aimAngle) * this.recoilKick;
      const recoilY = -Math.sin(this.aimAngle) * this.recoilKick;
      ctx.translate(recoilX, recoilY);

      // Tactical Boots with Walking Gait Cycle
      const stride = this.isMoving ? Math.sin(this.walkCycle) * 7 : 0;
      ctx.save();
      ctx.rotate(this.aimAngle);

      ctx.fillStyle = '#1e293b'; // Combat boot color
      // Left Boot
      ctx.fillRect(-10, -14 + stride, 12, 6);
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(-10, -14 + stride, 4, 6);

      // Right Boot
      ctx.fillStyle = '#1e293b';
      ctx.fillRect(-10, 8 - stride, 12, 6);
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(-10, 8 - stride, 4, 6);
      ctx.restore();

      ctx.rotate(this.aimAngle);

      // Tactical Laser Sight Beam
      if (settingsManager.data.laserColor !== 'off') {
        ctx.save();
        ctx.strokeStyle = oc ? oc.color : settingsManager.data.laserColor;
        ctx.lineWidth = 1;
        ctx.setLineDash([8, 8]);
        ctx.beginPath();
        ctx.moveTo(22, 0);
        ctx.lineTo(600, 0);
        ctx.stroke();
        ctx.restore();
      }

      // Weapon Construction (Detailed barrel, rails, stock, magazine)
      const barrelColor = oc ? oc.color : stats.barrelColor;
      ctx.fillStyle = barrelColor;
      ctx.strokeStyle = '#020617';
      ctx.lineWidth = 1.8;

      if (this.activeWeaponKey === 'pistols') {
        // Dual akimbo tactical sidearms
        ctx.fillRect(8, -13, 20, 5.5);
        ctx.strokeRect(8, -13, 20, 5.5);
        ctx.fillRect(8, 7.5, 20, 5.5);
        ctx.strokeRect(8, 7.5, 20, 5.5);
      } else if (this.activeWeaponKey === 'shotgun') {
        // Dual pump-action shotgun tubes
        ctx.fillRect(10, -5.5, 28, 11);
        ctx.strokeRect(10, -5.5, 28, 11);
        ctx.fillStyle = '#475569';
        ctx.fillRect(12, -3.5, 14, 7); // Ribbed pump
      } else if (this.activeWeaponKey === 'lmg') {
        // Heavy Titan LMG with box feed & thermal shroud
        ctx.fillRect(10, -5, 36, 10);
        ctx.strokeRect(10, -5, 36, 10);
        ctx.fillStyle = '#1e293b';
        ctx.fillRect(4, 9, 14, 12); // Box magazine
        ctx.strokeRect(4, 9, 14, 12);
      } else {
        // SMG with forward grip & magazine
        ctx.fillRect(10, -4, 24, 8);
        ctx.strokeRect(10, -4, 24, 8);
        ctx.fillStyle = '#334155';
        ctx.fillRect(16, 4, 6, 12); // Curved magazine
      }

      // Dynamic Muzzle Flash
      if (this.muzzleFlash > 0) {
        ctx.save();
        const flashDist = this.activeWeaponKey === 'lmg' ? 48 : 36;
        const flashSize = Math.random() * 9 + 10;
        const grad = ctx.createRadialGradient(flashDist, 0, 1, flashDist, 0, flashSize);
        grad.addColorStop(0, '#ffffff');
        grad.addColorStop(0.3, oc ? oc.bulletColor : '#fef08a');
        grad.addColorStop(1, 'rgba(239, 68, 68, 0)');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(flashDist, 0, flashSize, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      // Tactical Gloved Hands
      ctx.fillStyle = '#334155';
      ctx.strokeStyle = '#0f172a';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(11, -10, 4.5, 0, Math.PI * 2);
      ctx.arc(11, 10, 4.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      // Tactical Operative Torso / Military Kevlar Camo Vest
      const vestColor = (this.invulnTimer > 0 && Math.sin(Date.now() * 0.03) > 0) ? '#ef4444' : '#1e293b';
      ctx.fillStyle = vestColor;
      ctx.beginPath();
      ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
      ctx.fill();
      ctx.lineWidth = 3;
      ctx.strokeStyle = '#0f172a';
      ctx.stroke();

      // Camouflage tactical pouches across vest
      ctx.fillStyle = '#334155';
      ctx.fillRect(-6, -11, 5, 7);
      ctx.fillRect(-6, 4, 5, 7);
      ctx.fillRect(-12, -4, 5, 8); // Radio battery pack

      // Ballistic Combat Helmet & Visor
      ctx.fillStyle = '#0f172a';
      ctx.beginPath();
      ctx.arc(-2, 0, this.radius * 0.65, 0, Math.PI * 2);
      ctx.fill();

      // Night Vision Visor Glow
      ctx.fillStyle = oc ? oc.color : '#38bdf8';
      ctx.beginPath();
      ctx.arc(this.radius * 0.35, 0, this.radius * 0.42, -Math.PI / 2.5, Math.PI / 2.5);
      ctx.lineTo(this.radius * 0.3, 0);
      ctx.fill();

      ctx.restore();

      // Circular reload progress over operative
      if (this.isReloading) {
        ctx.save();
        const pct = 1 - (this.reloadTimer / this.reloadTotalTime);
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius + 12, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * pct);
        ctx.stroke();

        ctx.fillStyle = '#e2e8f0';
        ctx.font = 'bold 12px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('RELOADING [R]', this.x, this.y - this.radius - 18);
        ctx.restore();
      }
    }
  }

  // =========================================================================
  // 10. COLLISION SOLVER
  // =========================================================================
  function resolveObstacleCollision(entity, obstacles) {
    for (let i = 0; i < obstacles.length; i++) {
      const b = obstacles[i];
      const closestX = Math.max(b.x, Math.min(entity.x, b.x + b.w));
      const closestY = Math.max(b.y, Math.min(entity.y, b.y + b.h));

      const dx = entity.x - closestX;
      const dy = entity.y - closestY;
      const distSq = dx * dx + dy * dy;
      const r = entity.radius;

      if (distSq < r * r) {
        const dist = Math.sqrt(distSq);
        if (dist === 0) {
          entity.x += r;
        } else {
          const overlap = r - dist;
          entity.x += (dx / dist) * overlap;
          entity.y += (dy / dist) * overlap;
        }
      }
    }
  }

  function checkBulletObstacleHit(bullet, obstacles) {
    for (let i = 0; i < obstacles.length; i++) {
      const b = obstacles[i];
      if (bullet.x >= b.x && bullet.x <= b.x + b.w &&
          bullet.y >= b.y && bullet.y <= b.y + b.h) {
        return true;
      }
    }
    return false;
  }

  // =========================================================================
  // 11. ROUND MANAGER
  // =========================================================================
  class RoundManager {
    constructor() {
      this.round = 1;
      this.intermissionTimer = CONFIG.ROUND_START_DELAY;
      this.isIntermission = true;
      this.enemiesSpawnedThisRound = 0;
      this.totalEnemiesForRound = 0;
      this.spawnTimer = 0;
      this.roundCompletedBonusAwarded = false;

      this.calcRoundEnemies();
    }

    calcRoundEnemies() {
      this.totalEnemiesForRound = CONFIG.BASE_ENEMY_COUNT + (this.round - 1) * CONFIG.ENEMY_COUNT_GROWTH;
      this.enemiesSpawnedThisRound = 0;
    }

    startNextRound() {
      this.round++;
      this.calcRoundEnemies();
      this.intermissionTimer = CONFIG.ROUND_START_DELAY;
      this.isIntermission = true;
      this.roundCompletedBonusAwarded = false;
      audio.playRoundComplete();
    }

    update(dt, aliveEnemiesCount, spawnCallback, onRoundClear) {
      if (this.isIntermission) {
        this.intermissionTimer -= dt;
        if (this.intermissionTimer <= 0) {
          this.isIntermission = false;
          audio.playRoundStart();
        }
        return;
      }

      if (this.enemiesSpawnedThisRound >= this.totalEnemiesForRound && aliveEnemiesCount === 0) {
        if (!this.roundCompletedBonusAwarded) {
          this.roundCompletedBonusAwarded = true;
          if (onRoundClear) onRoundClear(this.round);
          this.startNextRound();
        }
        return;
      }

      if (this.enemiesSpawnedThisRound < this.totalEnemiesForRound) {
        this.spawnTimer -= dt;
        const currentInterval = Math.max(
          CONFIG.SPAWN_INTERVAL_MIN,
          CONFIG.SPAWN_INTERVAL_BASE - (this.round * 0.055)
        );

        if (this.spawnTimer <= 0) {
          this.spawnTimer = currentInterval;
          this.enemiesSpawnedThisRound++;

          let type = 'walker';
          const r = Math.random();

          if (this.round >= 4 && r < 0.20) {
            type = 'brute';
          } else if (this.round >= 3 && r < 0.38) {
            type = 'spitter';
          } else if (this.round >= 2 && r < 0.58) {
            type = 'runner';
          }

          spawnCallback(type, this.round);
        }
      }
    }
  }

  // =========================================================================
  // 12. MAIN GAME CONTROLLER & STATE MACHINE
  // =========================================================================
  const GAME_STATES = {
    HOME: 'HOME',
    MAP_SELECT: 'MAP_SELECT',
    MENU: 'MENU',
    PLAYING: 'PLAYING',
    PAUSED: 'PAUSED',
    SHOP: 'SHOP',
    CYBER_FORGE: 'CYBER_FORGE',
    DASHBOARD: 'DASHBOARD',
    SETTINGS: 'SETTINGS',
    QUIT_CONFIRM: 'QUIT_CONFIRM',
    TERMINAL_SHUTDOWN: 'TERMINAL_SHUTDOWN',
    GAME_OVER: 'GAME_OVER'
  };

  class Game {
    constructor() {
      this.canvas = document.getElementById('gameCanvas');
      this.ctx = this.canvas.getContext('2d');
      this.input = new InputManager(this.canvas);

      this.state = GAME_STATES.HOME;
      this.previousState = GAME_STATES.HOME;
      this.lastTime = performance.now();

      this.selectedWeaponKey = 'lmg';
      this.selectedMapKey = 'outpost';
      this.currentMapKey = 'outpost';
      this.currentMap = MAPS.outpost;
      this.arenaAmbientParticles = [];

      // Atmospheric home screen embers
      this.homeEmberParticles = [];
      for (let i = 0; i < 45; i++) {
        this.homeEmberParticles.push({
          x: Math.random() * CONFIG.VIRTUAL_WIDTH,
          y: Math.random() * CONFIG.VIRTUAL_HEIGHT,
          vx: (Math.random() - 0.5) * 20,
          vy: -(Math.random() * 28 + 14),
          size: Math.random() * 3.5 + 1.2,
          alpha: Math.random() * 0.7 + 0.3,
          color: Math.random() > 0.4 ? '#ef4444' : '#f97316'
        });
      }

      this.player = null;
      this.roundManager = null;
      this.cyberForge = new CyberForgeMachine(800, 450);

      this.zombies = [];
      this.bullets = [];
      this.particles = [];
      this.pickups = [];
      this.grenades = [];
      this.mines = [];
      this.acidPools = [];
      this.scorePopups = [];
      this.screenShake = 0;

      this.setupWindowEvents();
      requestAnimationFrame(this.loop.bind(this));
    }

    setupWindowEvents() {
      window.addEventListener('resize', this.handleResize.bind(this));
      this.handleResize();

      window.addEventListener('blur', () => {
        if (this.state === GAME_STATES.PLAYING) {
          this.state = GAME_STATES.PAUSED;
        }
      });

      window.addEventListener('keydown', (e) => {
        if (e.key === 'p' || e.key === 'P' || e.key === 'Escape') {
          if (this.state === GAME_STATES.PLAYING) {
            this.state = GAME_STATES.PAUSED;
          } else if (this.state === GAME_STATES.PAUSED || this.state === GAME_STATES.SHOP || this.state === GAME_STATES.CYBER_FORGE || this.state === GAME_STATES.DASHBOARD) {
            this.state = GAME_STATES.PLAYING;
          }
        }
        if (e.key === 'm' || e.key === 'M') {
          audio.toggleMute();
        }
        if (e.key === 'u' || e.key === 'U') {
          if (this.state === GAME_STATES.PLAYING && this.player) {
            this.tryUpgradeWeapon();
          }
        }
      });
    }

    handleResize() {
      if (IS_TOUCH && window.innerHeight > window.innerWidth && this.state === GAME_STATES.PLAYING) {
        this.state = GAME_STATES.PAUSED;
      }
      const containerW = window.innerWidth;
      const containerH = window.innerHeight;
      let w = containerW;
      let h = containerW / CONFIG.ASPECT_RATIO;

      if (h > containerH) {
        h = containerH;
        w = containerH * CONFIG.ASPECT_RATIO;
      }

      this.canvas.style.width = `${Math.floor(w)}px`;
      this.canvas.style.height = `${Math.floor(h)}px`;
    }

    initArenaWeather() {
      this.arenaAmbientParticles = [];
      const map = this.currentMap || MAPS.outpost;
      const pType = map.particleType || 'embers';
      const count = pType === 'rain' ? 85 : 55;
      for (let i = 0; i < count; i++) {
        let vx = 0, vy = 0, size = 2;
        if (pType === 'snow') {
          vx = (Math.random() - 0.5) * 45;
          vy = Math.random() * 55 + 35;
          size = Math.random() * 3.5 + 1.5;
        } else if (pType === 'spores') {
          vx = (Math.random() - 0.5) * 35;
          vy = (Math.random() - 0.5) * 35;
          size = Math.random() * 3.5 + 2;
        } else if (pType === 'dust') {
          vx = Math.random() * 110 + 60;
          vy = (Math.random() - 0.5) * 20;
          size = Math.random() * 2.8 + 1.2;
        } else if (pType === 'rain') {
          vx = -95;
          vy = Math.random() * 260 + 520;
          size = Math.random() * 14 + 10;
        } else {
          // embers
          vx = (Math.random() - 0.5) * 30;
          vy = -(Math.random() * 45 + 20);
          size = Math.random() * 3 + 1.5;
        }
        this.arenaAmbientParticles.push({
          x: Math.random() * CONFIG.VIRTUAL_WIDTH,
          y: Math.random() * CONFIG.VIRTUAL_HEIGHT,
          vx, vy, size,
          alpha: Math.random() * 0.6 + 0.3,
          type: pType,
          color: map.particleColor || '#ef4444'
        });
      }
    }

    updateArenaWeather(dt) {
      const pType = (this.currentMap && this.currentMap.particleType) || 'embers';
      for (let i = 0; i < this.arenaAmbientParticles.length; i++) {
        const p = this.arenaAmbientParticles[i];
        if (pType === 'snow') {
          p.x += Math.sin(Date.now() * 0.002 + i) * 18 * dt + p.vx * dt;
          p.y += p.vy * dt;
          if (p.y > CONFIG.VIRTUAL_HEIGHT + 10) { p.y = -10; p.x = Math.random() * CONFIG.VIRTUAL_WIDTH; }
          if (p.x < -10) p.x = CONFIG.VIRTUAL_WIDTH + 10;
          if (p.x > CONFIG.VIRTUAL_WIDTH + 10) p.x = -10;
        } else if (pType === 'spores') {
          p.x += Math.cos(Date.now() * 0.0015 + i) * 25 * dt + p.vx * dt;
          p.y += Math.sin(Date.now() * 0.0015 + i) * 25 * dt + p.vy * dt;
          if (p.x < 0) p.x = CONFIG.VIRTUAL_WIDTH;
          if (p.x > CONFIG.VIRTUAL_WIDTH) p.x = 0;
          if (p.y < 0) p.y = CONFIG.VIRTUAL_HEIGHT;
          if (p.y > CONFIG.VIRTUAL_HEIGHT) p.y = 0;
        } else if (pType === 'dust') {
          p.x += p.vx * dt;
          p.y += p.vy * dt;
          if (p.x > CONFIG.VIRTUAL_WIDTH + 10) { p.x = -10; p.y = Math.random() * CONFIG.VIRTUAL_HEIGHT; }
        } else if (pType === 'rain') {
          p.x += p.vx * dt;
          p.y += p.vy * dt;
          if (p.y > CONFIG.VIRTUAL_HEIGHT + 20) { p.y = -20; p.x = Math.random() * (CONFIG.VIRTUAL_WIDTH + 200); }
        } else {
          p.x += p.vx * dt;
          p.y += p.vy * dt;
          if (p.y < -10) { p.y = CONFIG.VIRTUAL_HEIGHT + 10; p.x = Math.random() * CONFIG.VIRTUAL_WIDTH; }
        }
      }
    }

    drawArenaWeather(ctx) {
      const pType = (this.currentMap && this.currentMap.particleType) || 'embers';
      ctx.save();
      for (let i = 0; i < this.arenaAmbientParticles.length; i++) {
        const p = this.arenaAmbientParticles[i];
        ctx.globalAlpha = p.alpha;
        ctx.fillStyle = p.color;
        ctx.strokeStyle = p.color;
        if (pType === 'rain') {
          ctx.lineWidth = 1.2;
          ctx.beginPath();
          ctx.moveTo(p.x, p.y);
          ctx.lineTo(p.x - 3, p.y + p.size);
          ctx.stroke();
        } else {
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          ctx.fill();
        }
      }
      ctx.restore();
    }

    startNewGame() {
      this.currentMapKey = this.selectedMapKey || 'outpost';
      this.currentMap = MAPS[this.currentMapKey] || MAPS.outpost;
      this.player = new Player(this.selectedWeaponKey);
      this.player.applyMapPerk(this.currentMapKey);
      this.roundManager = new RoundManager();
      this.cyberForge = new CyberForgeMachine(800, 450);

      this.zombies = [];
      this.bullets = [];
      this.particles = [];
      this.pickups = [];
      this.grenades = [];
      this.mines = [];
      this.acidPools = [];
      this.scorePopups = [];
      this.screenShake = 0;

      this.initArenaWeather();

      this.state = GAME_STATES.PLAYING;
      sessionDashboard.recordGameStart();
      audio.playRoundStart();
    }

    toggleShop() {
      if (this.state === GAME_STATES.PLAYING) {
        this.previousState = GAME_STATES.PLAYING;
        this.state = GAME_STATES.SHOP;
      } else if (this.state === GAME_STATES.SHOP) {
        this.state = GAME_STATES.PLAYING;
      }
    }

    toggleDashboard() {
      if (this.state === GAME_STATES.PLAYING || this.state === GAME_STATES.PAUSED) {
        this.previousState = this.state;
        this.state = GAME_STATES.DASHBOARD;
      } else if (this.state === GAME_STATES.DASHBOARD) {
        this.state = this.previousState || GAME_STATES.PLAYING;
      }
    }

    // ---------------- Mobile / touch support ----------------
    requestMobileFullscreen() {
      if (this.fullscreenRequested || !IS_TOUCH) return;
      this.fullscreenRequested = true;
      const el = document.documentElement;
      const req = el.requestFullscreen || el.webkitRequestFullscreen;
      if (req) {
        try {
          const r = req.call(el);
          if (r && r.then) {
            r.then(() => {
              if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(() => {});
            }).catch(() => {});
          }
        } catch (err) { /* fullscreen not supported (e.g. iPhone Safari) */ }
      }
    }

    isNearForge() {
      if (!this.player || !this.cyberForge.active) return false;
      return Math.hypot(this.player.x - this.cyberForge.x, this.player.y - this.cyberForge.y) <= 110;
    }

    getTouchButtons() {
      const btns = [
        { id: 'reload', x: 1470, y: 700, r: 62, label: 'RELOAD', color: '#38bdf8' },
        { id: 'grenade', x: 1320, y: 748, r: 48, label: `GRENADE ${this.player ? this.player.grenades : 0}`, color: '#f59e0b' },
        { id: 'mine', x: 1478, y: 548, r: 48, label: `MINE ${this.player ? this.player.mines : 0}`, color: '#ef4444' }
      ];
      if (this.isNearForge()) {
        btns.push({ id: 'forge', x: 1330, y: 600, r: 52, label: 'FORGE', color: '#a855f7' });
      }
      return btns;
    }

    handleTouchButton(x, y) {
      if (!this.player) return false;
      // Round action buttons
      const btns = this.getTouchButtons();
      for (const b of btns) {
        if (Math.hypot(x - b.x, y - b.y) <= b.r + 8) {
          if (b.id === 'reload') this.player.startReload();
          if (b.id === 'grenade') this.player.throwGrenade(this.grenades);
          if (b.id === 'mine') this.player.plantMine(this.mines);
          if (b.id === 'forge') this.tryInteractCyberForge();
          return true;
        }
      }
      // Top bar: pause, stats, shop
      if (y <= 60) {
        if (x >= 576 && x <= 640) { this.state = GAME_STATES.PAUSED; this.input.resetTouchSticks(); audio.playClick(); return true; }
        if (x >= 1290 && x <= 1425) { this.input.resetTouchSticks(); this.toggleDashboard(); return true; }
