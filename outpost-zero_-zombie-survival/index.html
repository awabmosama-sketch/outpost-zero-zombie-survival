    }

    // =======================================================================
    // 0. MAP & COMBAT THEATER SELECTION SCREEN
    // =======================================================================
    drawMapSelect(ctx) {
      // Dark tactical backdrop with subtle vignette
      ctx.fillStyle = '#05070d';
      ctx.fillRect(0, 0, CONFIG.VIRTUAL_WIDTH, CONFIG.VIRTUAL_HEIGHT);

      // Radial emergency theater glow
      const pulse = Math.sin(Date.now() * 0.003) * 0.08 + 0.12;
      const glow = ctx.createRadialGradient(
        CONFIG.VIRTUAL_WIDTH / 2, CONFIG.VIRTUAL_HEIGHT / 2, 200,
        CONFIG.VIRTUAL_WIDTH / 2, CONFIG.VIRTUAL_HEIGHT / 2, 950
      );
      glow.addColorStop(0, 'rgba(0, 0, 0, 0)');
      glow.addColorStop(1, `rgba(185, 28, 28, ${pulse})`);
      ctx.fillStyle = glow;
      ctx.fillRect(0, 0, CONFIG.VIRTUAL_WIDTH, CONFIG.VIRTUAL_HEIGHT);

      // Floor grid lines
      ctx.strokeStyle = 'rgba(30, 41, 59, 0.4)';
      ctx.lineWidth = 1;
      for (let x = 0; x < CONFIG.VIRTUAL_WIDTH; x += 80) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, CONFIG.VIRTUAL_HEIGHT);
        ctx.stroke();
      }
      for (let y = 0; y < CONFIG.VIRTUAL_HEIGHT; y += 80) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(CONFIG.VIRTUAL_WIDTH, y);
        ctx.stroke();
      }

      // Back to Homepage Button (Top Left)
      const mx = this.input.mouse.x;
      const my = this.input.mouse.y;
      const backHover = mx >= 40 && mx <= 260 && my >= 25 && my <= 67;

      ctx.save();
      ctx.fillStyle = backHover ? 'rgba(30, 41, 59, 0.98)' : 'rgba(15, 23, 42, 0.9)';
      ctx.beginPath();
      ctx.roundRect(40, 25, 220, 42, 6);
      ctx.fill();
      ctx.strokeStyle = backHover ? '#38bdf8' : '#334155';
      ctx.lineWidth = backHover ? 2 : 1;
      ctx.stroke();

      ctx.textAlign = 'center';
      ctx.fillStyle = backHover ? '#ffffff' : '#38bdf8';
      ctx.font = 'bold 13px sans-serif';
      ctx.fillText('◀  BACK  [ESC]', 150, 51);
      ctx.restore();

      // Top Header
      ctx.save();
      ctx.textAlign = 'center';
      ctx.fillStyle = '#f59e0b';
      ctx.font = 'bold 12px sans-serif';
      ctx.fillText('STEP 1 OF 2', CONFIG.VIRTUAL_WIDTH / 2, 40);

      ctx.fillStyle = '#ffffff';
      ctx.font = '900 32px sans-serif';
      ctx.fillText('CHOOSE YOUR MAP', CONFIG.VIRTUAL_WIDTH / 2, 76);

      ctx.fillStyle = '#94a3b8';
      ctx.font = '14px sans-serif';
      ctx.fillText('Click a map or press 1–5. Each map has its own layout, zombies and bonus.', CONFIG.VIRTUAL_WIDTH / 2, 104);
      ctx.restore();

      // 5 Map Selection Cards
      const mapKeys = ['outpost', 'ice', 'jungle', 'desert', 'city'];
      const cardW = 286;
      const gap = 14;
      const totalW = 5 * cardW + 4 * gap;
      const startX = (CONFIG.VIRTUAL_WIDTH - totalW) / 2;
      const cardY = 126;
      const cardH = 566;

      for (let i = 0; i < mapKeys.length; i++) {
        const key = mapKeys[i];
        const map = MAPS[key];
        const isSelected = (this.selectedMapKey || this.currentMapKey) === key;
        const cx = startX + i * (cardW + gap);
        const cardHover = mx >= cx && mx <= cx + cardW && my >= cardY && my <= cardY + cardH;

        ctx.save();
        // Card Background
        ctx.fillStyle = isSelected ? 'rgba(15, 23, 42, 0.98)' : (cardHover ? 'rgba(15, 23, 42, 0.92)' : 'rgba(10, 14, 23, 0.88)');
        ctx.beginPath();
        ctx.roundRect(cx, cardY, cardW, cardH, 8);
        ctx.fill();

        // Border & Glow
        ctx.strokeStyle = isSelected ? map.accentColor : (cardHover ? '#64748b' : '#1e293b');
        ctx.lineWidth = isSelected ? 2.5 : 1;
        ctx.stroke();

        if (isSelected) {
          ctx.strokeStyle = `${map.accentColor}44`;
          ctx.lineWidth = 8;
          ctx.stroke();
        }

        // 1. Sector Badge & Hotkey
        ctx.textAlign = 'left';
        ctx.fillStyle = isSelected ? map.accentColor : '#64748b';
        ctx.font = 'bold 11px monospace';
        ctx.fillText(`MAP ${i + 1}`, cx + 16, cardY + 24);

        // 2. Map Title & Icon
        ctx.fillStyle = '#ffffff';
        let titleSize = 18;
        ctx.font = `900 ${titleSize}px sans-serif`;
        while (titleSize > 12 && ctx.measureText(map.name.toUpperCase()).width > cardW - 32) {
          titleSize--;
          ctx.font = `900 ${titleSize}px sans-serif`;
        }
        ctx.fillText(map.name.toUpperCase(), cx + 16, cardY + 48);

        ctx.fillStyle = '#94a3b8';
        ctx.font = '11px sans-serif';
        ctx.fillText(map.tagline, cx + 16, cardY + 66);

        // 3. Mini Schematic Terrain Box
        const miniX = cx + 14;
        const miniY = cardY + 76;
        const miniW = cardW - 28;
        const miniH = 88;

        ctx.save();
        ctx.fillStyle = map.floorColor;
        ctx.fillRect(miniX, miniY, miniW, miniH);

        // Mini Grid
        ctx.strokeStyle = map.gridColor;
        ctx.lineWidth = 1;
        for (let gx = 0; gx < miniW; gx += 20) {
          ctx.beginPath(); ctx.moveTo(miniX + gx, miniY); ctx.lineTo(miniX + gx, miniY + miniH); ctx.stroke();
        }
        for (let gy = 0; gy < miniH; gy += 20) {
          ctx.beginPath(); ctx.moveTo(miniX, miniY + gy); ctx.lineTo(miniX + miniW, miniY + gy); ctx.stroke();
        }

        // Mini Obstacles
        const scaleX = miniW / 1600;
        const scaleY = miniH / 900;
        for (let o = 0; o < map.obstacles.length; o++) {
          const obs = map.obstacles[o];
          const ox = miniX + obs.x * scaleX;
          const oy = miniY + obs.y * scaleY;
          const ow = obs.w * scaleX;
          const oh = obs.h * scaleY;
          ctx.fillStyle = obs.color || map.obstacleColor;
          ctx.fillRect(ox, oy, ow, oh);
          ctx.strokeStyle = obs.border || map.accentColor;
          ctx.strokeRect(ox, oy, ow, oh);
        }

        // Mini frame border
        ctx.strokeStyle = isSelected ? map.accentColor : '#334155';
        ctx.lineWidth = 1.2;
        ctx.strokeRect(miniX, miniY, miniW, miniH);
        ctx.restore();

        // 4. Brief Description
        ctx.fillStyle = '#cbd5e1';
        ctx.font = '11px sans-serif';
        ctx.textAlign = 'left';
        wrapText(ctx, map.description, cx + 16, cardY + 184, cardW - 32, 16);

        // 5. Biome Operative Perk Box
        const perkBoxY = cardY + 238;
        const perkBoxH = 68;
        ctx.fillStyle = 'rgba(30, 41, 59, 0.7)';
        ctx.beginPath();
        ctx.roundRect(cx + 14, perkBoxY, cardW - 28, perkBoxH, 6);
        ctx.fill();
        ctx.strokeStyle = isSelected ? '#f59e0b' : '#334155';
        ctx.lineWidth = 1;
        ctx.stroke();

        ctx.fillStyle = '#fef08a';
        ctx.font = 'bold 11px monospace';
        ctx.fillText(`⚡ MAP BONUS: ${map.perkName}`, cx + 22, perkBoxY + 20);

        ctx.fillStyle = '#94a3b8';
        ctx.font = '10px sans-serif';
        wrapText(ctx, map.perkDesc, cx + 22, perkBoxY + 36, cardW - 44, 14);

        // 6. Regional Mutant Strains
        const mutantY = cardY + 322;
        ctx.fillStyle = '#64748b';
        ctx.font = 'bold 10px monospace';
        ctx.fillText('ZOMBIES ON THIS MAP', cx + 16, mutantY);

        const zKeys = ['walker', 'runner', 'brute', 'spitter'];
        for (let k = 0; k < zKeys.length; k++) {
          const zk = zKeys[k];
          const zInfo = map.zombies[zk];
          const zy = mutantY + 18 + k * 32;

          // Dot indicator
          ctx.fillStyle = zInfo.color;
          ctx.beginPath();
          ctx.arc(cx + 22, zy - 4, 4.5, 0, Math.PI * 2);
          ctx.fill();

          // Monster Name
          ctx.fillStyle = '#f1f5f9';
          ctx.font = 'bold 11px sans-serif';
          ctx.fillText(zInfo.name, cx + 34, zy);

          // Subtitle
          ctx.fillStyle = '#94a3b8';
          ctx.font = '10px sans-serif';
          ctx.fillText(zInfo.subtitle, cx + 34, zy + 13);
        }

        // 7. Select Action Button inside card
        const btnY = cardY + cardH - 52;
        const btnH = 38;
        ctx.fillStyle = isSelected ? map.accentColor : (cardHover ? '#334155' : 'rgba(30, 41, 59, 0.85)');
        ctx.beginPath();
        ctx.roundRect(cx + 14, btnY, cardW - 28, btnH, 6);
        ctx.fill();
        ctx.strokeStyle = isSelected ? '#ffffff' : '#334155';
        ctx.lineWidth = 1;
        ctx.stroke();

        ctx.textAlign = 'center';
        ctx.fillStyle = isSelected ? '#ffffff' : (cardHover ? '#ffffff' : '#cbd5e1');
        ctx.font = 'bold 12px sans-serif';
        ctx.fillText(isSelected ? '✔ SELECTED' : `SELECT  [${i + 1}]`, cx + cardW / 2, btnY + 24);

        ctx.restore();
      }

      // Bottom Deployment Action Button
      const depW = 460;
      const depH = 56;
      const depX = (CONFIG.VIRTUAL_WIDTH - depW) / 2;
      const depY = 716;
      const depHover = mx >= depX && mx <= depX + depW && my >= depY && my <= depY + depH;
      const selMap = MAPS[this.selectedMapKey || this.currentMapKey];

      ctx.save();
      const depGrad = ctx.createLinearGradient(depX, depY, depX + depW, depY + depH);
      depGrad.addColorStop(0, depHover ? '#b91c1c' : '#991b1b');
      depGrad.addColorStop(1, depHover ? '#7f1d1d' : '#450a0a');
      ctx.fillStyle = depGrad;
      ctx.beginPath();
      ctx.roundRect(depX, depY, depW, depH, 8);
      ctx.fill();
      ctx.strokeStyle = depHover ? '#fca5a5' : '#ef4444';
      ctx.lineWidth = depHover ? 2.5 : 1.5;
      ctx.stroke();

      if (depHover) {
        ctx.strokeStyle = 'rgba(239, 68, 68, 0.4)';
        ctx.lineWidth = 6;
        ctx.stroke();
      }

      ctx.textAlign = 'center';
      ctx.fillStyle = '#ffffff';
      ctx.font = '900 18px sans-serif';
      ctx.fillText('NEXT: CHOOSE WEAPON  [ENTER]  ➔', CONFIG.VIRTUAL_WIDTH / 2, depY + 35);
      ctx.restore();
    }

    // =======================================================================
    // 4. WEAPON LOADOUT SELECTION SCREEN (WITH BACK TO HOMEPAGE BUTTON)
    // =======================================================================
    drawMenu(ctx) {
      ctx.fillStyle = 'rgba(5, 7, 10, 0.97)';
      ctx.fillRect(0, 0, CONFIG.VIRTUAL_WIDTH, CONFIG.VIRTUAL_HEIGHT);

      const mx = this.input.mouse.x;
      const my = this.input.mouse.y;

      // Back to Map Selection Button (Top Left)
      const backHover = mx >= 40 && mx <= 260 && my >= 25 && my <= 67;
      ctx.save();
      ctx.fillStyle = backHover ? 'rgba(30, 41, 59, 0.98)' : 'rgba(15, 23, 42, 0.9)';
      ctx.beginPath();
      ctx.roundRect(40, 25, 220, 42, 6);
      ctx.fill();
      ctx.strokeStyle = backHover ? '#38bdf8' : '#334155';
      ctx.lineWidth = backHover ? 2 : 1.5;
      ctx.stroke();

      ctx.textAlign = 'center';
      ctx.fillStyle = backHover ? '#ffffff' : '#38bdf8';
      ctx.font = 'bold 13px sans-serif';
      ctx.fillText('◀  BACK TO MAPS  [ESC]', 150, 51);
      ctx.restore();

      // Active Map Badge / Switch Button (Top Right)
      const curMap = this.currentMap || MAPS.outpost;
      const mapBadgeHover = mx >= CONFIG.VIRTUAL_WIDTH - 300 && mx <= CONFIG.VIRTUAL_WIDTH - 40 && my >= 25 && my <= 67;
      ctx.save();
      ctx.fillStyle = mapBadgeHover ? 'rgba(30, 41, 59, 0.98)' : 'rgba(15, 23, 42, 0.9)';
      ctx.beginPath();
      ctx.roundRect(CONFIG.VIRTUAL_WIDTH - 300, 25, 260, 42, 6);
      ctx.fill();
      ctx.strokeStyle = curMap.accentColor || '#38bdf8';
      ctx.lineWidth = mapBadgeHover ? 2.2 : 1.5;
      ctx.stroke();

      ctx.textAlign = 'center';
      ctx.fillStyle = curMap.accentColor || '#38bdf8';
      ctx.font = 'bold 13px sans-serif';
      ctx.fillText(`MAP: ${curMap.name.toUpperCase()}  ·  CHANGE`, CONFIG.VIRTUAL_WIDTH - 170, 51);
      ctx.restore();

      // Bloody Outpost Zero Header
      this.drawBloodyTitle(ctx, CONFIG.VIRTUAL_WIDTH / 2, 115, 0.72, false);

      ctx.textAlign = 'center';
      ctx.fillStyle = '#f59e0b';
      ctx.font = 'bold 12px sans-serif';
      ctx.fillText('STEP 2 OF 2', CONFIG.VIRTUAL_WIDTH / 2, 222);
      ctx.fillStyle = '#ffffff';
      ctx.font = '900 26px sans-serif';
      ctx.fillText('CHOOSE YOUR STARTING WEAPON', CONFIG.VIRTUAL_WIDTH / 2, 254);
      ctx.fillStyle = '#94a3b8';
      ctx.font = '14px sans-serif';
      ctx.fillText('Click a weapon or press 1–4. You carry all four in-game and can switch any time.', CONFIG.VIRTUAL_WIDTH / 2, 280);

      const cardKeys = ['lmg', 'smg', 'shotgun', 'pistols'];
      const cardW = 320;
      const cardH = 360;
      const startX = (CONFIG.VIRTUAL_WIDTH - (4 * cardW + 3 * 20)) / 2;
      const cardY = 300;

      for (let i = 0; i < cardKeys.length; i++) {
        const key = cardKeys[i];
        const wDef = WEAPONS[key];
        const stats = wDef.tiers[0];
        const cx = startX + i * (cardW + 20);
        const isSelected = this.selectedWeaponKey === key;

        ctx.save();
        ctx.fillStyle = isSelected ? '#1e293b' : '#0f172a';
        ctx.strokeStyle = isSelected ? '#38bdf8' : '#334155';
        ctx.lineWidth = isSelected ? 3 : 1;
        ctx.beginPath();
        ctx.roundRect(cx, cardY, cardW, cardH, 8);
        ctx.fill();
        ctx.stroke();

        if (isSelected) {
          ctx.strokeStyle = 'rgba(56, 189, 248, 0.4)';
          ctx.lineWidth = 8;
          ctx.stroke();
        }

        ctx.textAlign = 'left';
        ctx.fillStyle = isSelected ? '#38bdf8' : '#64748b';
        ctx.font = 'bold 13px sans-serif';
        ctx.fillText(`[${i + 1}] ${wDef.shortName}`, cx + 20, cardY + 32);

        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 22px sans-serif';
        ctx.fillText(wDef.name, cx + 20, cardY + 62);

        ctx.fillStyle = '#94a3b8';
        ctx.font = '12px sans-serif';
        wrapText(ctx, wDef.description, cx + 20, cardY + 90, cardW - 40, 18);

        const statStartY = cardY + 160;
        const barW = 160;
        const barH = 8;

        const statList = [
          { label: 'DAMAGE', val: stats.damage * (stats.pellets || 1), max: 140 },
          { label: 'FIRE RATE', val: stats.fireRate, max: 24 },
          { label: 'MAGAZINE', val: stats.magSize, max: 90 },
          { label: 'RELOAD SPD', val: 4 - stats.reloadTime, max: 3.5 }
        ];

        for (let s = 0; s < statList.length; s++) {
          const st = statList[s];
          const sy = statStartY + s * 34;

          ctx.fillStyle = '#64748b';
          ctx.font = 'bold 11px sans-serif';
          ctx.fillText(st.label, cx + 20, sy);

          ctx.fillStyle = 'rgba(0, 0, 0, 0.45)';
          ctx.fillRect(cx + 120, sy - 9, barW, barH);

          const fillPct = Math.min(1, Math.max(0.1, st.val / st.max));
          ctx.fillStyle = isSelected ? '#38bdf8' : '#0ea5e9';
          ctx.fillRect(cx + 120, sy - 9, barW * fillPct, barH);
        }

        ctx.fillStyle = '#e2e8f0';
        ctx.font = 'bold 12px monospace';
        const resLabel = stats.maxReserve === Infinity ? 'SPARE AMMO: UNLIMITED' : `SPARE AMMO: ${stats.maxReserve}`;
        ctx.fillText(`MAGAZINE: ${stats.magSize}   ·   ${resLabel}`, cx + 20, cardY + cardH - 60);

        ctx.fillStyle = isSelected ? '#38bdf8' : 'rgba(30, 41, 59, 0.85)';
        ctx.beginPath();
        ctx.roundRect(cx + 20, cardY + cardH - 44, cardW - 40, 30, 6);
        ctx.fill();
        ctx.textAlign = 'center';
        ctx.fillStyle = isSelected ? '#0f172a' : '#cbd5e1';
        ctx.font = 'bold 12px sans-serif';
        ctx.fillText(isSelected ? '✔ SELECTED' : `SELECT  [${i + 1}]`, cx + cardW / 2, cardY + cardH - 24);

        ctx.restore();
      }

      // Deploy Button
      const btnW = 400;
      const btnH = 65;
      const btnX = (CONFIG.VIRTUAL_WIDTH - btnW) / 2;
      const btnY = 710;
      const curM = this.currentMap || MAPS.outpost;

      ctx.fillStyle = '#ef4444';
      ctx.beginPath();
      ctx.roundRect(btnX, btnY, btnW, btnH, 8);
      ctx.fill();
      ctx.strokeStyle = '#f87171';
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.fillStyle = '#ffffff';
      ctx.font = '900 20px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('START GAME  [ENTER]  ➔', CONFIG.VIRTUAL_WIDTH / 2, btnY + 41);
    }

    drawPaused(ctx) {
      ctx.fillStyle = 'rgba(5, 7, 10, 0.75)';
      ctx.fillRect(0, 0, CONFIG.VIRTUAL_WIDTH, CONFIG.VIRTUAL_HEIGHT);

      ctx.textAlign = 'center';
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 44px sans-serif';
      ctx.fillText('GAME PAUSED', CONFIG.VIRTUAL_WIDTH / 2, 340);

      ctx.fillStyle = '#94a3b8';
      ctx.font = '16px sans-serif';
      ctx.fillText('Press P or ESC to resume', CONFIG.VIRTUAL_WIDTH / 2, 385);

      const bW = 280;
      const bH = 50;
      ctx.fillStyle = '#2563eb';
      ctx.beginPath();
      ctx.roundRect(CONFIG.VIRTUAL_WIDTH / 2 - bW / 2, 480, bW, bH, 6);
      ctx.fill();

      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 18px sans-serif';
      ctx.fillText('RESUME', CONFIG.VIRTUAL_WIDTH / 2, 512);

      ctx.fillStyle = '#334155';
      ctx.beginPath();
      ctx.roundRect(CONFIG.VIRTUAL_WIDTH / 2 - bW / 2, 555, bW, bH, 6);
      ctx.fill();

      ctx.fillStyle = '#cbd5e1';
      ctx.fillText('QUIT TO MAIN MENU', CONFIG.VIRTUAL_WIDTH / 2, 587);

      ctx.fillStyle = '#64748b';
      ctx.font = '13px sans-serif';
      ctx.fillText('WASD: Move  ·  Click: Shoot  ·  R: Reload  ·  1–4 / Q / E: Switch Weapon  ·  G: Grenade  ·  X: Mine', CONFIG.VIRTUAL_WIDTH / 2, 680);
      ctx.fillText('B: Shop  ·  U: Upgrade Weapon  ·  F: Use Forge (Round 3+)  ·  TAB: Stats', CONFIG.VIRTUAL_WIDTH / 2, 702);
    }

    drawGameOver(ctx) {
      ctx.fillStyle = 'rgba(10, 14, 23, 0.94)';
      ctx.fillRect(0, 0, CONFIG.VIRTUAL_WIDTH, CONFIG.VIRTUAL_HEIGHT);

      ctx.textAlign = 'center';
      ctx.fillStyle = '#ef4444';
      ctx.font = '900 64px -apple-system, sans-serif';
      ctx.fillText('YOU WERE OVERRUN', CONFIG.VIRTUAL_WIDTH / 2, 210);

      ctx.fillStyle = '#94a3b8';
      ctx.font = 'bold 18px sans-serif';
      ctx.fillText('GAME OVER — HERE’S HOW YOU DID', CONFIG.VIRTUAL_WIDTH / 2, 260);

      const boxW = 540;
      const boxH = 280;
      const boxX = (CONFIG.VIRTUAL_WIDTH - boxW) / 2;
      const boxY = 295;

      ctx.fillStyle = '#1e293b';
      ctx.strokeStyle = '#334155';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.roundRect(boxX, boxY, boxW, boxH, 8);
      ctx.fill();
      ctx.stroke();

      const accuracy = this.player.shotsFired > 0
        ? Math.round((this.player.shotsHit / this.player.shotsFired) * 100)
        : 0;

      const rows = [
        { label: 'ROUNDS SURVIVED', val: `${this.roundManager.round}` },
        { label: 'FINAL COMBAT SCORE', val: `${this.player.score.toLocaleString()} PTS` },
        { label: 'ZOMBIES ELIMINATED', val: `${this.player.totalKills}` },
        { label: 'WEAPON', val: `${WEAPONS[this.player.activeWeaponKey].name} ${this.player.getCurrentTierStats().tierName.split(' ')[0]}` },
        { label: 'FIRING ACCURACY', val: `${accuracy}%` },
        { label: 'SESSION HIGH SCORE', val: `${sessionDashboard.sessionData.highScore.toLocaleString()} PTS` }
      ];

      for (let i = 0; i < rows.length; i++) {
        const ry = boxY + 40 + i * 38;
        ctx.textAlign = 'left';
        ctx.fillStyle = '#94a3b8';
        ctx.font = 'bold 14px sans-serif';
        ctx.fillText(rows[i].label, boxX + 30, ry);

        ctx.textAlign = 'right';
        ctx.fillStyle = '#f8fafc';
        ctx.font = 'bold 16px monospace';
        ctx.fillText(rows[i].val, boxX + boxW - 30, ry);
      }

      const bW = 300;
      const bH = 55;
      ctx.fillStyle = '#22c55e';
      ctx.beginPath();
      ctx.roundRect(CONFIG.VIRTUAL_WIDTH / 2 - bW / 2, 605, bW, bH, 6);
      ctx.fill();

      ctx.fillStyle = '#052e16';
      ctx.font = '900 20px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('PLAY AGAIN  [ENTER]', CONFIG.VIRTUAL_WIDTH / 2, 640);

      ctx.fillStyle = '#334155';
      ctx.beginPath();
      ctx.roundRect(CONFIG.VIRTUAL_WIDTH / 2 - bW / 2, 675, bW, 48, 6);
      ctx.fill();

      ctx.fillStyle = '#cbd5e1';
      ctx.font = 'bold 16px sans-serif';
      ctx.fillText('MAIN MENU', CONFIG.VIRTUAL_WIDTH / 2, 705);
    }

    drawCrosshair(ctx) {
      const mx = this.input.mouse.x;
      const my = this.input.mouse.y;
      const style = settingsManager.data.crosshairStyle;
      const reticleColor = settingsManager.data.laserColor !== 'off' ? settingsManager.data.laserColor : '#38bdf8';

      ctx.save();
      ctx.strokeStyle = reticleColor;
      ctx.fillStyle = reticleColor;
      ctx.lineWidth = 1.5;

      if (style === 'dot') {
        // High-precision Tactical Dot
        ctx.beginPath();
        ctx.arc(mx, my, 3.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 1;
        ctx.stroke();
      } else if (style === 'circle') {
        // Military Circle-Dot Reticle
        ctx.beginPath();
        ctx.arc(mx, my, 8, 0, Math.PI * 2);
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(mx, my, 2, 0, Math.PI * 2);
        ctx.fill();
      } else {
        // Classic Tactical Crosshair
        ctx.beginPath();
        ctx.arc(mx, my, 2, 0, Math.PI * 2);
        ctx.fill();

        const len = 8;
        const gap = 5;

        ctx.beginPath();
        ctx.moveTo(mx, my - gap);
        ctx.lineTo(mx, my - gap - len);
        ctx.moveTo(mx, my + gap);
        ctx.lineTo(mx, my + gap + len);
        ctx.moveTo(mx - gap, my);
        ctx.lineTo(mx - gap - len, my);
        ctx.moveTo(mx + gap, my);
        ctx.lineTo(mx + gap + len, my);
        ctx.stroke();
      }

      ctx.restore();
    }
  }

  function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
    const words = text.split(' ');
    let line = '';
    for (let n = 0; n < words.length; n++) {
      const testLine = line + words[n] + ' ';
      const metrics = ctx.measureText(testLine);
      const testWidth = metrics.width;
      if (testWidth > maxWidth && n > 0) {
        ctx.fillText(line, x, y);
        line = words[n] + ' ';
        y += lineHeight;
      } else {
        line = testLine;
      }
    }
    ctx.fillText(line, x, y);
  }

  window.addEventListener('DOMContentLoaded', () => {
    window.game = new Game();
  });

})();
</script>
